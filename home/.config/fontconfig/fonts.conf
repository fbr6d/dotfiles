<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- UI: Pretendard (Apple-style), code/terminal: D2Coding -->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer>
      <family>Pretendard</family>
      <family>Noto Sans CJK KR</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>monospace</family>
    <prefer>
      <family>D2Coding</family>
      <family>Noto Sans Mono CJK KR</family>
    </prefer>
  </alias>

  <!-- Apple / system UI font names used by websites and apps -->
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>system-ui</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>-apple-system</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>BlinkMacSystemFont</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>SF Pro</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>SF Pro Text</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>SF Pro Display</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Apple SD Gothic Neo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Helvetica Neue</string></test>
    <edit name="family" mode="assign" binding="strong"><string>Pretendard</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>SF Mono</string></test>
    <edit name="family" mode="assign" binding="strong"><string>D2Coding</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Menlo</string></test>
    <edit name="family" mode="assign" binding="strong"><string>D2Coding</string></edit>
  </match>
  <match target="pattern">
    <test name="family" compare="eq" qual="any"><string>Monaco</string></test>
    <edit name="family" mode="assign" binding="strong"><string>D2Coding</string></edit>
  </match>
</fontconfig>
