# 사용할 메인 폰트 이름 (예: JetBrainsMono Nerd Font Mono 또는 D2Coding)
font_family      D2Coding

# 굵기/기울임꼴 설정 (auto로 두면 폰트에 맞춰 자동으로 적용됩니다)
bold_font        auto
italic_font      auto
bold_italic_font auto

# 폰트 크기 (포인트 단위)
font_size        15.0

include theme.conf

# Shell
shell fish

# Nerd Font icons (yazi, LazyVim, starship): send their code points to Symbols Nerd Font
# Mono, otherwise kitty falls back to Material Symbols, which uses the same
# private-use range and draws the wrong pictures.
symbol_map U+E5FA-U+E6B7,U+E700-U+E8EF,U+ED00-U+F2FF,U+E200-U+E2A9,U+E0A0-U+E0A3,U+E0B0-U+E0D7,U+23FB-U+23FE,U+2B58,U+F400-U+F533,U+F0001-U+F1AF0,U+E300-U+E3E3,U+F500-U+FD46,U+EA60-U+EC1E Symbols Nerd Font Mono

# F1 = shortcut list of whatever is focused. In a plain shell it opens kitty's own
# command palette (every kitty action with its shortcut, searchable); inside yazi
# or Neovim (also RustQuest's window, whose fixed title hides nvim) F1 is passed
# through so they show their own built-in key help.
map --when-focus-on 'not title:"(?i)^(yazi|n?vim|RustQuest)"' f1 command_palette

# ─── 하단 상태표시줄 ───────────────────────────────────────────────
# kitty에 내장된 탭 바를 창 맨 아래줄에 띄워서 상태표시줄처럼 씁니다.
# 탭마다 "번호  실행 중인 프로그램  현재 폴더"를 보여 줍니다.
# 색상(배경, 활성/비활성 탭 색)은 theme.conf의 tab_* 항목에서 정합니다.

# 탭 바 위치: top(맨 위) 또는 bottom(맨 아래)
tab_bar_edge          bottom

# 탭이 몇 개 이상일 때 바를 보여 줄지 정합니다.
# 1이면 탭이 하나뿐이어도 항상 보입니다. (기본값 2는 탭이 둘 이상일 때만 표시)
tab_bar_min_tabs      1

# 탭 모양: fade(흐려짐), separator(구분자), powerline(이어진 화살표/곡선), slant(기울기),
# hidden(숨김), custom(직접 만든 tab_bar.py) 중에서 고릅니다.
tab_bar_style         powerline

# powerline 모양의 탭 끝 모양: angled(뾰족), slanted(사선), round(둥근 알약)
tab_powerline_style   round

# 탭 바 위/아래 여백(픽셀). 첫 숫자는 탭 바 바깥쪽(창 가장자리 쪽), 둘째는 안쪽(글자 쪽)
tab_bar_margin_height 2 0

# 탭 제목이 이 글자 수보다 길면 잘라서 …으로 줄입니다. (0이면 자르지 않음)
tab_title_max_length  40

# 비활성 탭에 표시할 내용
#   {index}           탭 번호 (1부터). ctrl+shift+1~9 같은 탭 이동 단축키와 같은 번호
#   {tab.active_exe}  그 탭에서 지금 실행 중인 프로그램 이름 (fish, nvim, yazi …)
#   {fmt.fg._9c9a92}  이 뒤의 글자를 흐린 회색(#9c9a92)으로 칠합니다
#   {tab.active_wd…}  그 탭의 현재 폴더. 홈 경로(/home/leejaeik)는 ~ 로 줄여서 보여 줍니다
tab_title_template    "{index}  {tab.active_exe}  {fmt.fg._9c9a92}{tab.active_wd.replace('/home/leejaeik', '~')}"

# 지금 보고 있는(활성) 탭에 표시할 내용. 항목은 위와 같고, 폴더도 강조색 그대로 보여 줍니다
active_tab_title_template "{index}  {tab.active_exe}  {tab.active_wd.replace('/home/leejaeik', '~')}"

# 글꼴 스타일: normal, bold(굵게), italic(기울임), bold-italic
# 활성 탭은 굵게 해서 눈에 띄게, 비활성 탭은 보통 굵기로 둡니다
active_tab_font_style   bold
inactive_tab_font_style normal

# Cursor animation: a short trail follows the cursor when it jumps (nvim, yazi, shell)
cursor_trail                    3
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshold    2
