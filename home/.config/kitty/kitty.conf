# 사용할 메인 폰트 이름 (예: JetBrainsMono Nerd Font Mono 또는 D2Coding)
font_family      D2Coding

# 굵기/기울임꼴 설정 (auto로 두면 폰트에 맞춰 자동으로 적용됩니다)
bold_font        auto
italic_font      auto
bold_italic_font auto

# 폰트 크기 (포인트 단위)
font_size        15.0

include theme.conf

# Shell
shell fish

# Nerd Font icons (yazi, LazyVim, starship): send their code points to Symbols Nerd Font
# Mono, otherwise kitty falls back to Material Symbols, which uses the same
# private-use range and draws the wrong pictures.
# nvim breakpoint dot (U+EA71): drawn over two cells, so it is big without
# spilling into the line numbers (nvim/lua/plugins/dap.lua puts a space after it)
narrow_symbols U+EA71 2

symbol_map U+E5FA-U+E6B7,U+E700-U+E8EF,U+ED00-U+F2FF,U+E200-U+E2A9,U+E0A0-U+E0A3,U+E0B0-U+E0D7,U+23FB-U+23FE,U+2B58,U+F400-U+F533,U+F0001-U+F1AF0,U+E300-U+E3E3,U+F500-U+FD46,U+EA60-U+EC1E Symbols Nerd Font Mono

# F1 = shortcut list of whatever is focused. In a plain shell it opens kitty's own
# command palette (every kitty action with its shortcut, searchable); inside yazi
# or Neovim (also RustQuest's window, whose fixed title hides nvim) F1 is passed
# through so they show their own built-in key help.
map --when-focus-on 'not title:"(?i)^(yazi|n?vim|RustQuest)"' f1 command_palette

# Ctrl+Shift+T inside yazi = reopen the last closed yazi tab (yazi plugin
# closed-tabs), not kitty's "new tab": pass the key through to yazi
map --when-focus-on 'title:"(?i)^yazi"' ctrl+shift+t

# ─── 하단 상태표시줄 ───────────────────────────────────────────────
# kitty에 내장된 탭 바를 창 맨 아래줄에 띄워서 상태표시줄처럼 씁니다.
# 탭마다 "번호  실행 중인 프로그램  현재 폴더"를 보여 줍니다.
# 색상(배경, 활성/비활성 탭 색)은 theme.conf의 tab_* 항목에서 정합니다.

# 탭 바 위치: top(맨 위) 또는 bottom(맨 아래)
tab_bar_edge          bottom

# 탭이 몇 개 이상일 때 바를 보여 줄지 정합니다.
# 1이면 탭이 하나뿐이어도 항상 보입니다. (기본값 2는 탭이 둘 이상일 때만 표시)
tab_bar_min_tabs      1

# 탭 모양: fade(흐려짐), separator(구분자), powerline(이어진 화살표/곡선), slant(기울기),
# hidden(숨김), custom(직접 만든 tab_bar.py) 중에서 고릅니다.
tab_bar_style         powerline

# powerline 모양의 탭 끝 모양: angled(뾰족), slanted(사선), round(둥근 알약)
tab_powerline_style   round

# 탭 바 위/아래 여백(픽셀). 첫 숫자는 탭 바 바깥쪽(창 가장자리 쪽), 둘째는 안쪽(글자 쪽)
tab_bar_margin_height 2 0

# 탭 제목이 이 글자 수보다 길면 잘라서 …으로 줄입니다. (0이면 자르지 않음)
tab_title_max_length  40

# 비활성 탭에 표시할 내용
#   {index}           탭 번호 (1부터)
#   {tab.active_exe}  그 탭에서 지금 실행 중인 프로그램 이름 (fish, nvim, yazi …)
#   {fmt.fg._9c9a92}  이 뒤의 글자를 흐린 회색(#9c9a92)으로 칠합니다
#   {tab.active_wd…}  그 탭의 현재 폴더. 홈 경로(/home/leejaeik)는 ~ 로 줄여서 보여 줍니다
tab_title_template    "{index}  {tab.active_exe}  {fmt.fg._9c9a92}{tab.active_wd.replace('/home/leejaeik', '~')}"

# 지금 보고 있는(활성) 탭에 표시할 내용. 항목은 위와 같고, 폴더도 강조색 그대로 보여 줍니다
active_tab_title_template "{index}  {tab.active_exe}  {tab.active_wd.replace('/home/leejaeik', '~')}"

# 글꼴 스타일: normal, bold(굵게), italic(기울임), bold-italic
# 활성 탭은 굵게 해서 눈에 띄게, 비활성 탭은 보통 굵기로 둡니다
active_tab_font_style   bold
inactive_tab_font_style normal

# Cursor animation: a short trail follows the cursor when it jumps (nvim, yazi, shell)
cursor_trail                    3
cursor_trail_decay              0.1 0.4
cursor_trail_start_threshold    2

# ─── 창 분할 ───────────────────────────────────────────────────────
# splits: 원하는 방향으로 나누는 배치, stack: 지금 창 하나만 크게 (Ctrl+Alt+Z로 전환)
enabled_layouts splits,stack

# 나누기. 새 창은 지금 창과 같은 폴더에서 열립니다
#   Ctrl+Shift+Enter  긴 쪽 방향으로 알아서 나누기 (kitty 기본 키, 동작만 바꿈)
#   Ctrl+Alt+\        좌우로 나누기 (새 창이 오른쪽)
#   Ctrl+Alt+-        위아래로 나누기 (새 창이 아래)
map kitty_mod+enter launch --location=split --cwd=current
map ctrl+alt+backslash launch --location=vsplit --cwd=current
map ctrl+alt+minus     launch --location=hsplit --cwd=current

# 나뉜 창 사이 이동: Ctrl+Alt+방향키
map ctrl+alt+left  neighboring_window left
map ctrl+alt+right neighboring_window right
map ctrl+alt+up    neighboring_window up
map ctrl+alt+down  neighboring_window down

# Ctrl+H/J/K/L: 칸 이동을 nvim과 같이 씁니다 (smart-splits.nvim).
# nvim이 떠 있는 칸에서는 키를 nvim에 넘겨 nvim 창 분할 사이를 먼저 오가고,
# nvim 가장자리에서 한 번 더 누르면 옆 kitty 칸으로 넘어갑니다.
# (셸에서 Ctrl+L 화면 지우기 대신 clear 명령을 쓰면 됩니다)
map ctrl+h neighboring_window left
map ctrl+j neighboring_window bottom
map ctrl+k neighboring_window top
map ctrl+l neighboring_window right
map --when-focus-on var:IS_NVIM ctrl+h
map --when-focus-on var:IS_NVIM ctrl+j
map --when-focus-on var:IS_NVIM ctrl+k
map --when-focus-on var:IS_NVIM ctrl+l

# nvim이 kitty 칸을 옮길 때 쓰는 원격 제어 소켓 (kitty마다 /tmp/kitty-<pid>)
# 바꾼 뒤에는 kitty를 새로 열어야 적용됩니다 (설정 다시 읽기로는 안 바뀜)
allow_remote_control socket-only
listen_on unix:/tmp/kitty

# 창 위치 옮기기: Ctrl+Alt+H/J/K/L (vim 방향: 왼쪽/아래/위/오른쪽; 포커스 이동 Ctrl+H/J/K/L에 Alt만 더함)
map ctrl+alt+h move_window left
map ctrl+alt+j move_window down
map ctrl+alt+k move_window up
map ctrl+alt+l move_window right

# Ctrl+Alt+R: 나누는 방향 바꾸기 (좌우 ↔ 위아래)
map ctrl+alt+r layout_action rotate

# Ctrl+Alt+Z: 지금 창만 크게 보기 ↔ 다시 나눈 화면
map ctrl+alt+z toggle_layout stack

# Ctrl+Alt+B: 동시 입력. 아래에 열리는 입력 칸에 친 글자가 이 탭의 모든 칸에
# 똑같이 들어갑니다 (예: cd 한 번으로 두 칸 같이 이동). 끝낼 때는 Ctrl+Esc
map ctrl+alt+b launch --allow-remote-control kitty +kitten broadcast --match-tab state:focused

# 크기 조절은 기본 키 Ctrl+Shift+R (화살표로 조절, Esc로 끝), 닫기는 Ctrl+Shift+W

# Ctrl+Shift+F6: 지금 상태 그대로 kitty 재시작 (~/.local/bin/kitty-restart).
# 탭, 분할, 폴더, 실행 중인 프로그램을 저장해 같은 자리에 새 창으로 다시 엽니다.
# 저장 안 한 nvim 파일이 있으면 재시작하지 않습니다. (원래 이 키는 설정 디버그 창)
map kitty_mod+f6 launch --type=background --allow-remote-control /home/leejaeik/.local/bin/kitty-restart
