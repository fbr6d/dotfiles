# Lock screen: just a blurred snapshot of the desktop and a rounded password
# field in the middle (no clock, date or user name).

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    brightness = 0.55
    color = rgb(262624)
}

# Rounded password field, monochrome
input-field {
    monitor =
    size = 380, 54
    rounding = -1
    outline_thickness = 1
    outer_color = rgb(4a4a47)
    inner_color = rgb(30302e)
    font_color = rgb(faf9f5)
    check_color = rgb(e6e6e6)
    fail_color = rgb(4a4a47)
    fail_text = <span color="#9c9a92">비밀번호가 올바르지 않습니다</span>
    placeholder_text =
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}
