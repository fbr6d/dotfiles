# Lock screen: just a blurred snapshot of the desktop and a rounded password
# field in the middle (no clock, date or user name).

general {
    hide_cursor = true
    grace = 0
    ignore_empty_input = true
}

# Smooth typing: the screen fades in/out, password dots slide in, and the
# field's border fades between idle / typing / wrong-password colors
animations {
    enabled = true
    bezier = soft, 0.25, 0.1, 0.25, 1.0
    animation = fadeIn, 1, 4, soft
    animation = fadeOut, 1, 4, soft
    animation = inputFieldDots, 1, 2, soft
    animation = inputFieldColors, 1, 4, soft
    animation = inputFieldFade, 1, 3, soft
    animation = inputFieldWidth, 1, 3, soft
}

background {
    monitor =
    path = screenshot
    blur_passes = 4
    blur_size = 12
    brightness = 0.55
    color = rgb(262624)
}

# Rounded password field, monochrome, no border; dots grow out from the center
input-field {
    monitor =
    size = 380, 54
    rounding = -1
    outline_thickness = 0
    dots_center = true
    outer_color = rgb(4a4a47)
    inner_color = rgb(30302e)
    font_color = rgb(faf9f5)
    check_color = rgb(e6e6e6)
    fail_color = rgb(4a4a47)
    fail_text = <span color="#9c9a92">비밀번호가 올바르지 않습니다</span>
    placeholder_text =
    dots_size = 0.22
    dots_spacing = 0.35
    fade_on_empty = false
    position = 0, 0
    halign = center
    valign = center
}
