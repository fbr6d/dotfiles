# (2026-11-19부터) 10분 자동 잠금은 꺼 두었고, 15분 뒤 화면 끄기와 절전 전 잠금만 남아 있다.
# Lock after 10 minutes idle, turn the screen off after 15, and always lock
# before the machine sleeps.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 2026-11-19 마스터 요청: 10분 자동 잠금 끔 (원래 설정 ~/.local/share/backups/autolock-off-20261119/hypridle.conf.bak)
# listener {
#     timeout = 600
#     on-timeout = loginctl lock-session
# }

listener {
    timeout = 900
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}
