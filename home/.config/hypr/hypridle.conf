# 2026-11-23 마스터 요청: 5분 넘게 입력이 없으면 정각 멘트(miku_hourly.py)를 건너뛰도록 표시 파일만 만든다.
#   화면 끄기·잠금은 하지 않는다. 원래 설정 ~/.local/share/backups/hourly-idle-20261123/hypridle.conf.bak
listener {
    timeout = 300
    on-timeout = touch /run/user/1000/miku-idle
    on-resume = rm -f /run/user/1000/miku-idle
}
