# Overrides on top of yazi's defaults
[mgr]
sort_by        = "extension"   # files with the same extension (same icon) stay together
sort_dir_first = true          # folders first

# "열기" 메뉴 (O / Shift+Enter): 파일 종류마다 고를 수 있는 앱
[opener]
edit      = [ { run = 'nvim %s', block = true, desc = "nvim으로 편집", for = "unix" } ]
kate      = [ { run = 'kate %s', orphan = true, desc = "Kate (창 편집기)" } ]
kwrite    = [ { run = 'kwrite %s', orphan = true, desc = "KWrite (간단 편집기)" } ]
open      = [ { run = 'xdg-open %s1', orphan = true, desc = "기본 앱으로 열기" } ]
zen       = [ { run = 'zen-browser %s', orphan = true, desc = "Zen 브라우저" } ]
chromium  = [ { run = 'chromium --ozone-platform=wayland %s', orphan = true, desc = "Chromium" } ]
papers    = [ { run = 'papers %s', orphan = true, desc = "Papers (PDF 보기)" } ]
drawio    = [ { run = 'drawio %s1', orphan = true, desc = "draw.io" } ]
imv       = [ { run = 'imv %s', orphan = true, desc = "imv (이미지 보기)" } ]
mpv       = [ { run = 'mpv --force-window=yes %s', orphan = true, desc = "mpv (재생)" } ]
ffplay    = [ { run = 'ffplay -autoexit -loglevel quiet %s1', orphan = true, desc = "ffplay로 재생" } ]
nautilus  = [ { run = 'nautilus --select %s1', orphan = true, desc = "Nautilus에서 보기" } ]
folder    = [ { run = 'nautilus %s1', orphan = true, desc = "Nautilus로 폴더 열기" } ]
localsend = [ { run = 'localsend %s', orphan = true, desc = "LocalSend로 보내기" } ]
convert   = [ { run = '/home/leejaeik/.local/bin/convert-to %s', block = true, desc = "다른 포맷으로 변환" } ]
csvlens   = [ { run = 'csvlens %s1', block = true, desc = "표로 보기 (csvlens)" } ]
hex       = [ { run = 'xxd %s1 | less', block = true, desc = "16진수로 보기" } ]
other     = [ { run = '/home/leejaeik/.local/bin/open-with %s', orphan = true, desc = "다른 앱 고르기…" } ]
extract   = [ { run = 'ya pub extract --list %s', desc = "여기에 압축 풀기" } ]

[open]
prepend_rules = [
	{ mime = "folder/*", use = [ "edit", "folder", "localsend", "other" ] },
	{ url = "*.drawio", use = [ "drawio", "edit", "localsend", "other" ] },
	{ url = "*.svg", use = [ "zen", "chromium", "drawio", "edit", "convert", "localsend", "other" ] },
	{ url = "*.{html,htm}", use = [ "zen", "chromium", "edit", "kate", "localsend", "other" ] },
	{ url = "*.tsv", use = [ "csvlens", "edit", "kate", "localsend", "other" ] },
	{ url = "*.md", use = [ "edit", "kate", "zen", "localsend", "other" ] },
	{ mime = "text/*", use = [ "edit", "kate", "kwrite", "localsend", "hex", "other", "nautilus" ] },
	{ mime = "application/{json,ndjson,javascript,toml,x-yaml,xml}", use = [ "edit", "kate", "kwrite", "localsend", "other" ] },
	{ mime = "application/pdf", use = [ "papers", "zen", "chromium", "localsend", "other", "nautilus" ] },
	{ mime = "image/*", use = [ "imv", "zen", "chromium", "convert", "localsend", "other", "nautilus" ] },
	{ mime = "{audio,video}/*", use = [ "mpv", "ffplay", "zen", "chromium", "convert", "localsend", "other", "nautilus" ] },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [ "extract", "nautilus", "localsend", "other" ] },
	{ mime = "inode/empty", use = [ "edit", "kate", "other" ] },
	{ url = "*", use = [ "hex", "open", "edit", "kate", "localsend", "other", "nautilus" ] },
]
