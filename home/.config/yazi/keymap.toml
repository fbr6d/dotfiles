# yazi key map: the default mgr keys (yazi 26.9.1) with "한국어 · English" descriptions,
# so the help list (~ / F1) reads in Korean but still filters by English words.
# This replaces the default mgr key list; the first three keys are extra ones added here.
[mgr]
keymap = [
	{ on = [ "g", "p" ], run = "shell -- p=\"$(wl-paste --no-newline)\"; p=\"${p#file://}\"; case \"$p\" in \"~\"*) p=\"$HOME${p#\\~}\";; esac; if [ -d \"$p\" ]; then ya emit cd \"$p\"; else ya emit reveal \"$p\"; fi", desc = "클립보드에 있는 경로로 · Go to the path in the clipboard" },
	{ on = "!", run = "shell \"$SHELL\" --block", desc = "여기서 셸 열기 (exit로 복귀) · Open a shell here" },
	{ on = "T", run = "shell -- kitty --detach --directory \"$PWD\"", desc = "여기서 새 터미널 창 · Open a new terminal window here" },
	{ on = "<Esc>", run = "escape", desc = "비주얼 모드 종료 · 선택 해제 · 검색 취소 · Exit visual mode, clear selection, or cancel search" },
	{ on = "<C-[>", run = "escape", desc = "비주얼 모드 종료 · 선택 해제 · 검색 취소 · Exit visual mode, clear selection, or cancel search" },
	{ on = "q", run = "plugin closed-tabs quit", desc = "종료 (Ctrl+Shift+T로 다시 열 수 있음) · Quit the process" },
	{ on = "Q", run = "plugin closed-tabs quit-no-cwd", desc = "그냥 종료 · Quit without outputting cwd-file" },
	{ on = "<C-c>", run = "plugin closed-tabs close", desc = "탭 닫기 · 마지막 탭이면 종료 · Close the current tab, or quit if it's last" },
	{ on = "<C-T>", run = "plugin closed-tabs restore", desc = "닫은 탭 다시 열기 · Reopen the last closed tab" },
	{ on = "<C-z>", run = "suspend", desc = "잠시 멈추고 셸로 (fg로 복귀) · Suspend the process" },
	{ on = "k", run = "arrow prev", desc = "이전 파일 · Previous file" },
	{ on = "j", run = "arrow next", desc = "다음 파일 · Next file" },
	{ on = "<Up>", run = "arrow prev", desc = "이전 파일 · Previous file" },
	{ on = "<Down>", run = "arrow next", desc = "다음 파일 · Next file" },
	{ on = [ "g", "g" ], run = "arrow top", desc = "맨 위로 · Go to top" },
	{ on = "G", run = "arrow bot", desc = "맨 아래로 · Go to bottom" },
	{ on = "<Home>", run = "arrow top", desc = "맨 위로 · Go to top" },
	{ on = "<End>", run = "arrow bot", desc = "맨 아래로 · Go to bottom" },
	{ on = "<C-u>", run = "arrow -50%", desc = "반 페이지 위로 · Move cursor up half page" },
	{ on = "<C-d>", run = "arrow 50%", desc = "반 페이지 아래로 · Move cursor down half page" },
	{ on = "<C-b>", run = "arrow -100%", desc = "한 페이지 위로 · Move cursor up one page" },
	{ on = "<C-f>", run = "arrow 100%", desc = "한 페이지 아래로 · Move cursor down one page" },
	{ on = "<S-PageUp>", run = "arrow -50%", desc = "반 페이지 위로 · Move cursor up half page" },
	{ on = "<S-PageDown>", run = "arrow 50%", desc = "반 페이지 아래로 · Move cursor down half page" },
	{ on = "<PageUp>", run = "arrow -100%", desc = "한 페이지 위로 · Move cursor up one page" },
	{ on = "<PageDown>", run = "arrow 100%", desc = "한 페이지 아래로 · Move cursor down one page" },
	{ on = "h", run = "leave", desc = "상위 폴더로 · Back to the parent directory" },
	{ on = "l", run = "enter", desc = "폴더 안으로 들어가기 · Enter the child directory" },
	{ on = "<Left>", run = "leave", desc = "상위 폴더로 · Back to the parent directory" },
	{ on = "<Right>", run = "enter", desc = "폴더 안으로 들어가기 · Enter the child directory" },
	{ on = "H", run = "back", desc = "이전에 있던 폴더로 · Back to previous directory" },
	{ on = "L", run = "forward", desc = "다음에 있던 폴더로 · Forward to next directory" },
	{ on = "<Space>", run = [ "toggle", "arrow 1" ], desc = "선택 · 해제 · Toggle the current selection state" },
	{ on = "<C-a>", run = "toggle_all --state=on", desc = "전체 선택 · Select all files" },
	{ on = "<C-r>", run = "toggle_all", desc = "선택 반전 · Invert selection of all files" },
	{ on = "v", run = "visual_mode", desc = "범위 선택 모드 · Enter visual mode (selection mode)" },
	{ on = "V", run = "visual_mode --unset", desc = "범위 선택 해제 모드 · Enter visual mode (unset mode)" },
	{ on = "K", run = "seek -5", desc = "미리보기 위로 스크롤 · Seek up 5 units in the preview" },
	{ on = "J", run = "seek 5", desc = "미리보기 아래로 스크롤 · Seek down 5 units in the preview" },
	{ on = "<Tab>", run = "spot", desc = "파일 정보 보기 · Spot hovered file" },
	{ on = "o", run = "open", desc = "열기 · Open selected files" },
	{ on = "O", run = "open --interactive", desc = "어떤 프로그램으로 열지 고르기 · Open selected files interactively" },
	{ on = "<Enter>", run = "open --interactive", desc = "어떤 프로그램으로 열지 고르기 · Open selected files interactively" },
	{ on = "<S-Enter>", run = "open", desc = "기본 앱으로 바로 열기 · Open selected files" },
	{ on = "y", run = "yank", desc = "복사 · Yank selected files (copy)" },
	{ on = "x", run = "yank --cut", desc = "잘라내기 · Yank selected files (cut)" },
	{ on = "p", run = "paste", desc = "붙여넣기 · Paste yanked files" },
	{ on = "P", run = "paste --force", desc = "붙여넣기 (같은 이름 덮어쓰기) · Paste yanked files (overwrite if the destination exists)" },
	{ on = "-", run = "link", desc = "절대 경로 심볼릭 링크 만들기 · Symlink the absolute path of yanked files" },
	{ on = "_", run = "link --relative", desc = "상대 경로 심볼릭 링크 만들기 · Symlink the relative path of yanked files" },
	{ on = "<C-->", run = "hardlink", desc = "하드 링크 만들기 · Hardlink yanked files" },
	{ on = "Y", run = "unyank", desc = "복사 · 잘라내기 취소 · Cancel the yank status" },
	{ on = "X", run = "unyank", desc = "복사 · 잘라내기 취소 · Cancel the yank status" },
	{ on = "d", run = "remove", desc = "휴지통으로 · Trash selected files" },
	{ on = "D", run = "remove --permanently", desc = "영구 삭제 · Permanently delete selected files" },
	{ on = "a", run = "create", desc = "새 파일 (끝에 / 붙이면 폴더) · Create a file (ends with / for directories)" },
	{ on = "A", run = "bulk_create", desc = "여러 개 한 번에 만들기 · Bulk create files" },
	{ on = "r", run = "rename --cursor=before_ext", desc = "이름 바꾸기 · Rename selected file(s)" },
	{ on = ";", run = "shell --interactive", desc = "셸 명령 실행 · Run a shell command" },
	{ on = ":", run = "shell --block --interactive", desc = "셸 명령 실행 (끝날 때까지 대기) · Run a shell command (block until finishes)" },
	{ on = ".", run = "hidden toggle", desc = "숨김 파일 보이기 · 숨기기 · Toggle the visibility of hidden files" },
	{ on = "s", run = "search --via=fd", desc = "하위 폴더까지 이름 검색 (fd) · Search files by name via fd" },
	{ on = "S", run = "search --via=rg", desc = "파일 내용 검색 (ripgrep) · Search files by content via ripgrep" },
	{ on = "<C-s>", run = "escape --search", desc = "검색 취소 · Cancel the ongoing search" },
	{ on = "z", run = "plugin fzf", desc = "fzf로 파일 · 폴더 찾아 이동 · Jump to a file/directory via fzf" },
	{ on = "Z", run = "plugin zoxide", desc = "zoxide로 자주 가는 폴더 이동 · Jump to a directory via zoxide" },
	{ on = [ "m", "s" ], run = "linemode size", desc = "옆에 크기 표시 · Linemode: size" },
	{ on = [ "m", "p" ], run = "linemode permissions", desc = "옆에 권한 표시 · Linemode: permissions" },
	{ on = [ "m", "b" ], run = "linemode btime", desc = "옆에 만든 시각 표시 · Linemode: btime" },
	{ on = [ "m", "m" ], run = "linemode mtime", desc = "옆에 수정 시각 표시 · Linemode: mtime" },
	{ on = [ "m", "o" ], run = "linemode owner", desc = "옆에 소유자 표시 · Linemode: owner" },
	{ on = [ "m", "n" ], run = "linemode none", desc = "옆 정보 끄기 · Linemode: none" },
	{ on = [ "c", "c" ], run = "copy path", desc = "파일 경로 복사 · Copy file path" },
	{ on = [ "c", "C" ], run = "copy url", desc = "파일 URL 복사 · Copy file URL" },
	{ on = [ "c", "d" ], run = "copy dirpath", desc = "폴더 경로 복사 · Copy directory path" },
	{ on = [ "c", "D" ], run = "copy dirurl", desc = "폴더 URL 복사 · Copy directory URL" },
	{ on = [ "c", "f" ], run = "copy filename", desc = "파일 이름 복사 · Copy filename" },
	{ on = [ "c", "n" ], run = "copy name_without_ext", desc = "확장자 뺀 파일 이름 복사 · Copy filename without extension" },
	{ on = "f", run = "filter --smart", desc = "목록 필터 · Filter files" },
	{ on = "/", run = "find --smart", desc = "이름으로 찾기 (다음) · Find next file" },
	{ on = "?", run = "find --previous --smart", desc = "이름으로 찾기 (이전) · Find previous file" },
	{ on = "n", run = "find_arrow", desc = "다음 결과 · Next found" },
	{ on = "N", run = "find_arrow --previous", desc = "이전 결과 · Previous found" },
	{ on = [ ",", "m" ], run = [ "sort mtime --reverse=no", "linemode mtime" ], desc = "수정 시각순 정렬 · Sort by modified time" },
	{ on = [ ",", "M" ], run = [ "sort mtime --reverse=yes", "linemode mtime" ], desc = "수정 시각순 정렬 (역순) · Sort by modified time (reverse)" },
	{ on = [ ",", "b" ], run = [ "sort btime --reverse=no", "linemode btime" ], desc = "만든 시각순 정렬 · Sort by birth time" },
	{ on = [ ",", "B" ], run = [ "sort btime --reverse=yes", "linemode btime" ], desc = "만든 시각순 정렬 (역순) · Sort by birth time (reverse)" },
	{ on = [ ",", "e" ], run = "sort extension --reverse=no", desc = "확장자순 정렬 · Sort by extension" },
	{ on = [ ",", "E" ], run = "sort extension --reverse=yes", desc = "확장자순 정렬 (역순) · Sort by extension (reverse)" },
	{ on = [ ",", "a" ], run = "sort alphabetical --reverse=no", desc = "이름순 정렬 · Sort alphabetically" },
	{ on = [ ",", "A" ], run = "sort alphabetical --reverse=yes", desc = "이름순 정렬 (역순) · Sort alphabetically (reverse)" },
	{ on = [ ",", "n" ], run = "sort natural --reverse=no", desc = "자연스러운 이름순 정렬 (2 < 10) · Sort naturally" },
	{ on = [ ",", "N" ], run = "sort natural --reverse=yes", desc = "자연스러운 이름순 정렬 (역순) · Sort naturally (reverse)" },
	{ on = [ ",", "s" ], run = [ "sort size --reverse=no", "linemode size" ], desc = "크기순 정렬 · Sort by size" },
	{ on = [ ",", "S" ], run = [ "sort size --reverse=yes", "linemode size" ], desc = "크기순 정렬 (역순) · Sort by size (reverse)" },
	{ on = [ ",", "r" ], run = "sort random --reverse=no", desc = "무작위 정렬 · Sort randomly" },
	{ on = [ "g", "h" ], run = "cd ~", desc = "홈 폴더로 · Go home" },
	{ on = [ "g", "c" ], run = "cd ~/.config", desc = "~/.config로 · Go to ~/.config" },
	{ on = [ "g", "d" ], run = "cd ~/Downloads", desc = "~/Downloads로 · Go to ~/Downloads" },
	{ on = [ "g", "u" ], run = "cd /run/media/leejaeik", desc = "USB 저장장치 목록으로 · Go to mounted USB drives" },
	{ on = "M", run = "plugin mount", desc = "디스크·USB 목록 (m 마운트 · u 해제 · e 꺼내기 · Enter 이동) · Mount manager" },
	{ on = [ "g", "t" ], run = "plugin trash", desc = "휴지통으로 이동 · Go to trash bin" },
	{ on = [ "g", "<Space>" ], run = "cd --interactive", desc = "경로 입력해서 이동 · Jump interactively" },
	{ on = [ "g", "f" ], run = "follow", desc = "링크가 가리키는 곳으로 · Follow hovered symlink" },
	{ on = [ "t", "t" ], run = "tab_create --current", desc = "현재 폴더로 새 탭 · Create a new tab in CWD" },
	{ on = [ "t", "r" ], run = "tab_rename --interactive", desc = "탭 이름 바꾸기 · Rename current tab" },
	{ on = "1", run = "tab_switch 0", desc = "1번 탭 · Switch to first tab" },
	{ on = "2", run = "tab_switch 1", desc = "2번 탭 · Switch to second tab" },
	{ on = "3", run = "tab_switch 2", desc = "3번 탭 · Switch to third tab" },
	{ on = "4", run = "tab_switch 3", desc = "4번 탭 · Switch to fourth tab" },
	{ on = "5", run = "tab_switch 4", desc = "5번 탭 · Switch to fifth tab" },
	{ on = "6", run = "tab_switch 5", desc = "6번 탭 · Switch to sixth tab" },
	{ on = "7", run = "tab_switch 6", desc = "7번 탭 · Switch to seventh tab" },
	{ on = "8", run = "tab_switch 7", desc = "8번 탭 · Switch to eighth tab" },
	{ on = "9", run = "tab_switch 8", desc = "9번 탭 · Switch to ninth tab" },
	{ on = "[", run = "tab_switch -1 --relative", desc = "이전 탭 · Switch to previous tab" },
	{ on = "]", run = "tab_switch 1 --relative", desc = "다음 탭 · Switch to next tab" },
	{ on = "{", run = "tab_swap -1", desc = "탭 순서 앞으로 · Swap current tab with previous tab" },
	{ on = "}", run = "tab_swap 1", desc = "탭 순서 뒤로 · Swap current tab with next tab" },
	{ on = "w", run = "tasks:show", desc = "작업 관리자 (복사 · 삭제 진행 상황) · Show task manager" },
	{ on = "~", run = "help", desc = "도움말 (단축키 목록) · Open help" },
	{ on = "<F1>", run = "help", desc = "도움말 (단축키 목록) · Open help" },
]
