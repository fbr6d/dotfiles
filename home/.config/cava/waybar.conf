# cava profile for the waybar visualizer (~/.local/bin/waybar-cava)
[general]
framerate = 30
bars = 10
# Fixed sensitivity: autosens kept boosting even quiet audio to full height.
# Raise for taller bars, lower for calmer ones.
autosens = 0
sensitivity = 400

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = mono

[smoothing]
monstercat = 1
noise_reduction = 85
