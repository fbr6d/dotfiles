# uosc 테마 — Claude 회색 + Catppuccin Mocha 강조색 (기본값은 scripts/uosc 의 uosc.conf 설명 참고)

# 색: foreground=강조(진행 막대·선택), background=패널, *_text=그 위 글자색
color=foreground=cba6f7,foreground_text=1e1e2e,background=262624,background_text=faf9f5,window_border=30302e,curtain=1e1e1c,success=a6e3a1,error=f38ba8,match=89b4fa,heatmap=89b4fa
opacity=timeline=0.85,position=1,chapters=0.8,slider=0.85,slider_gauge=1,controls=0,speed=0.6,menu=0.97,submenu=0.5,border=1,title=1,tooltip=0.95,thumbnail=1,curtain=0.75,idle_indicator=0.8,audio_indicator=0.5,buffering_indicator=0.3,playlist_position=0.8,heatmap=0.4,pause_indicator=0.85

# 모양
border_radius=8
font_bold=no
text_border=1
timeline_style=line
timeline_line_width=3
timeline_size=36
# 컨트롤이 숨어 있을 때 바닥에 얇은 진행선
progress=windowed
progress_size=2
progress_line_width=16
top_bar=no-border
pause_indicator=flash
animation_duration=120

# 동작
# 메뉴 한국어 (scripts/uosc/intl/ko.json)
languages=ko,en
# 다 보면 같은 폴더의 다음 파일
autoload=yes
# 파일 삭제 메뉴는 휴지통으로
use_trash=yes
default_directory=~/Videos
destination_time=playtime-remaining
