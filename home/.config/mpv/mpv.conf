# mpv 설정 — 화면은 uosc(scripts/uosc)가 그림, 테마는 script-opts/uosc.conf

# ── 창·재생 ──────────────────────────────
osc=no                        # 기본 컨트롤바 대신 uosc 사용
osd-bar=no                    # 볼륨·탐색 막대도 uosc가 표시
border=no                     # 창 테두리는 uosc가 그림
keep-open=yes                 # 끝나도 창을 닫지 않음
save-position-on-quit=yes     # 다음에 열면 마지막 위치부터 이어 보기
autofit-larger=85%x85%        # 큰 영상도 화면 85% 안에서 시작
volume=70
volume-max=150
gpu-api=opengl                # 이 맥북에는 Vulkan 장치가 없어서 바로 OpenGL 사용
hwdec=vaapi                   # GPU 디코딩 (Intel 드라이버가 있을 때만 켜짐, 없으면 CPU로 재생)

# ── 화면 글씨 (OSD) ───────────────────────
osd-font='Pretendard'
osd-font-size=28
osd-color='#faf9f5'
osd-border-color='#262624'
osd-border-size=2
osd-duration=1500

# ── 자막·오디오 언어 ───────────────────────
slang=ko,kor,kr,en,eng
alang=ko,kor,ja,jpn,en,eng
sub-auto=fuzzy                # 이름이 비슷한 자막 파일 자동으로 불러오기
sub-font='Pretendard SemiBold'
sub-font-size=44
sub-color='#faf9f5'
sub-border-color='#1e1e1c'
sub-border-size=2.5
sub-shadow-offset=1
sub-shadow-color='#00000080'
sub-margin-y=40

# ── 스크린샷 (s) ──────────────────────────
screenshot-directory=~/Pictures
screenshot-template='mpv-%F-%wH%wM%wS'
screenshot-format=png
