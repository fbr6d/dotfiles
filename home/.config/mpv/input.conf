# mpv 단축키 — 나머지는 mpv 기본값 (Space 재생, f 전체 화면, ←/→ 5초, ↑/↓ 1분, m 음소거, s 스크린샷, q 종료)
# 아래 "메뉴" 부분에서 줄 끝에 느낌표 주석을 단 줄이 우클릭 메뉴(uosc)에 그 이름으로 나타남

MBTN_RIGHT  script-binding uosc/menu       # 우클릭: 메뉴
MENU        script-binding uosc/menu
TAB         script-binding uosc/toggle-ui  # 컨트롤 잠깐 보이기

# vim식 이동
h           seek -5                        # 5초 뒤로
l           seek  5                        # 5초 앞으로
H           seek -60                       # 1분 뒤로
L           seek  60                       # 1분 앞으로
k           add volume  5                  # 볼륨 +
j           add volume -5                  # 볼륨 -
WHEEL_UP    add volume  5
WHEEL_DOWN  add volume -5

# 메뉴 (우클릭)
o           script-binding uosc/open-file          #! 파일 열기
p           script-binding uosc/items              #! 재생 목록
c           script-binding uosc/chapters           #! 챕터
S           script-binding uosc/subtitles          #! 자막
A           script-binding uosc/audio              #! 오디오 트랙
#           script-binding uosc/load-subtitles     #! 자막 불러오기
#           script-binding uosc/audio-device       #! 오디오 장치
#           script-binding uosc/stream-quality     #! 스트림 화질
f           cycle fullscreen                       #! 전체 화면
#           cycle-values loop-file inf no          #! 한 파일 반복
#           script-binding uosc/shuffle            #! 무작위 재생
[           multiply speed 1/1.1                   #! 속도 > 느리게
]           multiply speed 1.1                     #! 속도 > 빠르게
BS          set speed 1.0                          #! 속도 > 원래대로
s           async screenshot                       #! 스크린샷
#           script-binding uosc/show-in-directory  #! 폴더에서 보기
#           script-binding uosc/keybinds           #! 단축키 목록
#           script-binding uosc/open-config-directory #! 설정 폴더 열기
q           quit                                   #! 종료
