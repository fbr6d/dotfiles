<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>body{margin:0}</style></head><body>
<title>리눅스 명령어 사전</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600;700&display=swap">
<style>
/* Layout: A4 가로 시트(297×210mm)에 5단 그리드, 블록을 단 단위로 채워 넣는 인쇄용 치트시트. 좁은 화면은 단일 흐름. */
:root {
  --desk: #dfe2e7; --paper: #ffffff; --ink: #1a2130; --muted: #5b6474; --rule: #d3d8df; --tint: #f2f4f7;
  --shadow: rgba(20, 28, 45, .16); --scrim: rgba(20, 28, 45, .45);
  --s-cmd: #0f3b78; --s-sub: #12707f; --s-opt: #b1205a; --s-str: #3a7619; --s-var: #7546bd;
  --s-op: #c05400; --s-cmt: #858d99; --s-ph: #8e5d00; --s-k: #1a2130;
  --g-core: #2a57bf; --g-text: #0c8478; --g-sys: #a86f12; --g-net: #6843bd; --g-shell: #2b7f53; --g-dev: #bf2f2f;
  --on-g: #ffffff;
  --f-sans: "IBM Plex Sans KR", "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --f-mono: "JetBrains Mono", "D2Coding", "IBM Plex Sans KR", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --desk: #0d1015; --paper: #171b22; --ink: #e2e6ed; --muted: #98a1b0; --rule: #2b323d; --tint: #1f2530;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .62);
  --s-cmd: #8fb9ff; --s-sub: #5fd0d8; --s-opt: #ff80aa; --s-str: #9fd77f; --s-var: #c6a6ff;
  --s-op: #ffaf62; --s-cmt: #7c8696; --s-ph: #e3bd60; --s-k: #e2e6ed;
  --g-core: #3f6ad2; --g-text: #148f82; --g-sys: #b47d1e; --g-net: #7655cc; --g-shell: #348c5f; --g-dev: #c93c3c;
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --desk: #0d1015; --paper: #171b22; --ink: #e2e6ed; --muted: #98a1b0; --rule: #2b323d; --tint: #1f2530;
  --shadow: rgba(0, 0, 0, .5); --scrim: rgba(0, 0, 0, .62);
  --s-cmd: #8fb9ff; --s-sub: #5fd0d8; --s-opt: #ff80aa; --s-str: #9fd77f; --s-var: #c6a6ff;
  --s-op: #ffaf62; --s-cmt: #7c8696; --s-ph: #e3bd60; --s-k: #e2e6ed;
  --g-core: #3f6ad2; --g-text: #148f82; --g-sys: #b47d1e; --g-net: #7655cc; --g-shell: #348c5f; --g-dev: #c93c3c;
  color-scheme: dark;
}
@media print {
  :root, :root[data-theme="dark"], :root:not([data-theme="light"]) {
    --desk: #ffffff; --paper: #ffffff; --ink: #1a2130; --muted: #5b6474; --rule: #d3d8df; --tint: #f2f4f7;
    --s-cmd: #0f3b78; --s-sub: #12707f; --s-opt: #b1205a; --s-str: #3a7619; --s-var: #7546bd;
    --s-op: #c05400; --s-cmt: #858d99; --s-ph: #8e5d00; --s-k: #1a2130;
    --g-core: #2a57bf; --g-text: #0c8478; --g-sys: #a86f12; --g-net: #6843bd; --g-shell: #2b7f53; --g-dev: #bf2f2f;
    color-scheme: light;
  }
}
@page { size: A4 landscape; margin: 0; }

body { background: var(--paper); color: var(--ink); font-family: var(--f-sans); -webkit-print-color-adjust: exact; print-color-adjust: exact; }
* { box-sizing: border-box; }
code, pre { font-family: var(--f-mono); }

.desk { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 24px; }
.desk.pages { display: flex; flex-direction: column; align-items: center; gap: 24px; }

/* ---------- 시트 ---------- */
.sheet {
  width: 297mm; height: 210mm; flex: none; overflow: hidden;
  padding: 5.5mm 6.5mm 4mm; display: flex; flex-direction: column;
  background: var(--paper); box-shadow: 0 1px 2px var(--shadow), 0 10px 30px var(--shadow);
  font-size: 8pt; line-height: 1.3;
}
.cols { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); grid-template-rows: minmax(0, 1fr); }
.col { position: relative; min-height: 0; min-width: 0; overflow: hidden; display: flex; flex-direction: column; gap: .55em; padding-inline: 1.3mm; }
.col:first-child { padding-left: 0; }
.col:last-child { padding-right: 0; }
.col + .col { border-left: .2mm solid var(--rule); }
.foot { display: flex; justify-content: space-between; gap: 2em; margin-top: 1.6mm; padding-top: 1.1mm; border-top: .2mm solid var(--rule); font-size: .82em; color: var(--muted); }
.foot b { color: var(--ink); font-weight: 600; }
.foot .pg { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }

/* ---------- 머리말 ---------- */
.head { display: grid; grid-template-columns: auto minmax(0, .85fr) minmax(0, 1.7fr); gap: 5mm; align-items: start; padding-bottom: 2.2mm; margin-bottom: 2.2mm; border-bottom: .45mm solid var(--ink); }
.head h1 { margin: 0; font-size: 2.55em; line-height: 1.05; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.head h1 .pr { font-family: var(--f-mono); color: var(--s-op); font-weight: 700; margin-right: .2em; }
.head .sub { margin-top: .5em; font-family: var(--f-mono); font-size: .92em; color: var(--muted); }
.head h2 { margin: 0 0 .35em; font-size: .78em; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: .25em .9em; font-size: .95em; }
.legend code { font-size: 1.02em; }
.legend .nota { margin-top: .45em; display: flex; flex-wrap: wrap; gap: .2em .9em; color: var(--muted); }
.legend .nota code { color: var(--ink); }
.toc { display: flex; flex-wrap: wrap; gap: .2em .35em; }
.toc a { display: inline-flex; align-items: baseline; gap: .35em; padding: .1em .45em .1em .35em; border: .2mm solid var(--rule); border-radius: .4em; color: var(--ink); text-decoration: none; font-size: .92em; white-space: nowrap; }
.toc a::before { content: ""; width: .6em; height: .6em; border-radius: .15em; background: var(--g); align-self: center; }
.toc a:hover { border-color: var(--g); }
.toc a:focus-visible { outline: 2px solid var(--g); outline-offset: 1px; }
.toc .n { font-family: var(--f-mono); color: var(--muted); font-size: .9em; }
.flow .toc .n { display: none; }

/* ---------- 섹션 · 항목 ---------- */
.blk { display: flex; flex-direction: column; gap: .55em; }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: .6em; padding: .28em .55em; background: var(--g); color: var(--on-g); border-radius: .25em; font-weight: 700; font-size: 1.16em; line-height: 1.2; }
.sh small { font-size: .66em; font-weight: 600; letter-spacing: .1em; opacity: .85; }
.sh.cont { font-size: 1em; padding: .15em .55em; }
.sh.cont::after { content: "계속"; font-size: .7em; font-weight: 500; opacity: .85; }
.e { padding-bottom: .5em; border-bottom: .2mm dotted var(--rule); min-width: 0; }
.blk > .e:last-child, .col > .e:last-child { border-bottom-color: transparent; }
.eh { display: flex; flex-wrap: wrap; align-items: baseline; column-gap: .7em; row-gap: .05em; }
.syn { font-size: 1.04em; overflow-wrap: anywhere; }
.tt { font-weight: 700; color: var(--g); font-size: 1.04em; }
.e.cmd { padding-top: .15em; }
.e.cmd .syn { font-size: 1.1em; }
.num { display: inline-block; min-width: 1.9em; margin-right: .45em; padding: .02em .3em; border-radius: .2em; background: var(--g); color: var(--on-g); font-family: var(--f-mono); font-size: .82em; font-weight: 700; text-align: center; font-variant-numeric: tabular-nums; vertical-align: .08em; }
.dsc { margin: .25em 0 0; font-size: .97em; color: var(--ink); }
.dsc code { color: var(--s-opt); font-size: .95em; }
.toc b { font-family: var(--f-mono); font-weight: 600; color: var(--muted); font-size: .85em; }
.ed { color: var(--muted); font-size: .96em; }
.opts { display: grid; grid-template-columns: fit-content(48%) minmax(0, 1fr); column-gap: .8em; row-gap: .08em; margin: .3em 0 0; }
.opts dt { font-family: var(--f-mono); font-size: .93em; overflow-wrap: anywhere; }
.opts dd { margin: 0; font-size: .95em; min-width: 0; }
.ex { margin: .3em 0 0; padding: .3em .5em; background: var(--tint); border-radius: .25em; font-size: .92em; line-height: 1.32; white-space: pre-wrap; overflow-wrap: anywhere; tab-size: 4; }
.ex .ln { display: block; padding-left: 1.05em; text-indent: -1.05em; }
.ex .ln.np { padding-left: 0; text-indent: 0; }
.ex .pr { color: var(--s-cmt); user-select: none; }
.nt { margin: .3em 0 0; font-size: .93em; color: var(--muted); }
.nt::before { content: "▸ "; color: var(--g); }
.ed code, .opts dd code, .nt code { font-size: .95em; color: var(--s-opt); }

/* 구문 강조 */
.t-cmd { color: var(--s-cmd); font-weight: 700; }
.t-sub { color: var(--s-sub); font-weight: 600; }
.t-opt { color: var(--s-opt); }
.t-str { color: var(--s-str); }
.t-var { color: var(--s-var); }
.t-op  { color: var(--s-op); font-weight: 700; }
.t-cmt { color: var(--s-cmt); font-style: italic; font-family: var(--f-sans); }
.t-ph  { color: var(--s-ph); font-style: italic; }
.t-k   { color: var(--s-k); font-weight: 600; }
.t-sep { color: var(--s-cmt); }

/* ---------- 흐름(좁은 화면) ---------- */
.flow { max-width: 1400px; margin: 0 auto; font-size: 13px; line-height: 1.38; }
.flow .head { grid-template-columns: 1fr; gap: 14px; background: var(--paper); padding: 16px; border-radius: 6px; border-bottom-width: 3px; margin-bottom: 18px; }
.flow .head h1 { font-size: 26px; }
.flowcols { columns: 300px; column-gap: 20px; }
.flowcols > * { break-inside: avoid; margin-bottom: 10px; background: var(--paper); padding: 8px 10px; border-radius: 6px; }
.flowcols > .blk { padding-top: 0; padding-inline: 0; overflow: hidden; }
.flowcols > .blk > .sh { border-radius: 0; }
.flowcols > .blk > .e { padding-inline: 10px; }
.flow-note { color: var(--muted); font-size: 12px; margin: 0 0 12px; }

@media print {
  body { background: #fff; }
  .desk, .desk.pages { padding: 0 !important; gap: 0; zoom: 1 !important; }
  .sheet { box-shadow: none; break-after: page; }
  .sheet:last-child { break-after: auto; }
  .zoom-tip, .ov-bar { display: none !important; }
  .ov { position: static; padding: 0; }
  .ov-panel { height: auto; overflow: visible; }
  .ov-body { overflow: visible; zoom: 1 !important; }
  html.ov-open, html.ov-open body { overflow: visible !important; }
}
/* ---------- 색인 · 상세 보기 ---------- */
[hidden] { display: none !important; }
html.ov-open, html.ov-open body { overflow: hidden; }
.ov { position: fixed; inset: 0; z-index: 50; display: flex; justify-content: center; background: var(--paper);
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
.ov-panel { width: 100%; height: 100%; display: flex; flex-direction: column; background: var(--paper); color: var(--ink); overflow: hidden; }
.ov-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--rule); }
.ov-body { position: relative; flex: 1; min-height: 0; overflow: auto; padding: 20px 24px 32px; outline: none; }
.ov-bar button { font: 600 14px/1 var(--f-sans); color: var(--ink); background: var(--tint); border: 1px solid var(--rule); border-radius: 6px; padding: 9px 13px; cursor: pointer; white-space: nowrap; }
.ov-bar button:hover:not(:disabled) { border-color: var(--muted); }
.ov-bar button:disabled { opacity: .4; cursor: default; }
.ov button:focus-visible, #ov-q:focus-visible { outline: 2px solid var(--s-cmd); outline-offset: 2px; }
.ov-title { font-size: 18px; font-weight: 700; margin-right: auto; }
.ov-title .pr { font-family: var(--f-mono); color: var(--s-op); margin-right: .25em; }
#ov-q { flex: 1 1 220px; max-width: 340px; min-width: 0; font: 15px var(--f-sans); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.ov-pos { font: 600 14px var(--f-mono); color: var(--muted); padding: 0 4px; font-variant-numeric: tabular-nums; }
.ov-sp { flex: 1; }
.ov-keys { font-size: 12px; color: var(--muted); }
.ix-sec { margin-bottom: 20px; }
.ix-sec h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-size: 14px; color: var(--g); }
.ix-sec h3::before { content: ""; width: 10px; height: 10px; border-radius: 2px; background: var(--g); }
.ix-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 8px; }
.ix-item { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 3px; align-items: baseline; text-align: left; font: inherit; color: var(--ink); background: var(--paper); border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
.ix-item:hover { border-color: var(--g); background: var(--tint); }
.ix-item .num { font-size: 13px; margin: 0; }
.ix-item code { font-size: 17px; font-weight: 700; color: var(--s-cmd); }
.ix-item .ix-d { grid-column: 2; font-size: 13px; color: var(--muted); }
.ix-empty { color: var(--muted); font-size: 15px; }
.ix-n { font: 600 12px var(--f-mono); color: var(--muted); }
.ix-jump { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.ix-jump button { display: inline-flex; align-items: center; gap: 6px; font: 600 13px var(--f-sans); color: var(--ink); background: var(--tint); border: 1px solid var(--rule); border-radius: 999px; padding: 5px 11px; cursor: pointer; }
.ix-jump button::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--g); }
.ix-jump button:hover { border-color: var(--g); }
.ix-jump b { font: 600 11px var(--f-mono); color: var(--muted); }
.ov-detail { max-width: 920px; margin: 0 auto; font-size: 16px; line-height: 1.45; }
.ov-detail .e { border-bottom: 0; padding-bottom: 10px; }
.ov-detail .e + .e { border-top: 1px dashed var(--rule); padding-top: 12px; }
.ov-detail .e.cmd .syn { font-size: 1.45em; }
.ov-detail .tt { font-size: 1.12em; }
.ov-detail .opts { row-gap: .25em; column-gap: 1.2em; margin-top: .6em; }
.ov-detail .ex { padding: .6em .8em; margin-top: .6em; }
.ov-sec { display: inline-block; margin-bottom: 10px; padding: 3px 10px; border-radius: 4px; background: var(--g); color: var(--on-g); font-size: 13px; font-weight: 700; }
.fab { position: fixed; z-index: 40; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 11px 18px; border: 0; border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 14px var(--f-sans); box-shadow: 0 6px 20px var(--shadow); cursor: pointer; }
html.ov-open .fab { display: none; }
.fab:focus-visible { outline: 2px solid var(--s-op); outline-offset: 2px; }
.zoom-tip { position: fixed; z-index: 60; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); padding: 6px 14px; border-radius: 999px; background: var(--ink); color: var(--paper); font: 700 14px var(--f-mono); box-shadow: 0 6px 20px var(--shadow); pointer-events: none; }
.flash { outline: 3px solid var(--s-op); outline-offset: 3px; border-radius: 2px; }

@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-label="명령어 색인" hidden>
  <div class="ov-panel"><div class="ov-bar" id="ov-bar"></div><div class="ov-body" id="ov-body" tabindex="-1"></div></div>
</div>

<script type="text/plain" id="src">

# 파일 · 디렉토리 | core
@ ls [옵션] [경로…] :: 디렉토리 내용 나열
~ 경로를 생략하면 현재 디렉토리. 옵션은 `-lah` 처럼 합쳐 쓸 수 있다.
- -l :: 긴 형식: 권한 · 링크 수 · 소유자 · 그룹 · 크기 · 수정 시각
- -a :: `.` 으로 시작하는 숨김 파일까지
- -A :: 숨김 포함, 단 `.` `..` 제외
- -h :: 크기를 1K · 234M · 2G 처럼 (-l 과 함께)
- -t :: 수정 시각 최신순
- -S :: 크기 큰 순
- -r :: 정렬 역순
- -R :: 하위 디렉토리까지 재귀
- -d :: 디렉토리 안이 아니라 디렉토리 자체 정보
- -1 :: 한 줄에 하나씩 (스크립트 처리용)
- -i :: inode 번호
- -F :: 종류 표시 (/ 디렉토리, * 실행, @ 링크)
$ ls -lah                  # 숨김 포함 상세 목록
$ ls -lt | head            # 최근 수정 10개
$ ls -lhS ~/Downloads      # 큰 파일부터
$ ls -ld /etc              # /etc 자체의 권한
> 출력 예: -rw-r--r-- 1 kim dev 4.0K Nov 2 09:12 app.conf
> 스크립트에서는 ls 출력을 파싱하지 말고 글롭(*.txt)이나 find 를 쓴다

@ cd [디렉토리] :: 작업 디렉토리 이동
~ 셸 내장 명령. 인자가 없으면 홈으로 간다.
- cd / cd ~ :: 홈 디렉토리
- cd - :: 직전 디렉토리로 (왔다 갔다)
- cd .. / cd ../.. :: 한 단계 / 두 단계 위
- cd / :: 루트
$ cd /var/log && ls   # → /var/log 로 이동해 로그 파일 목록 출력
$ cd -                     # 직전 위치로 돌아가며 경로 출력
> CDPATH 변수에 자주 가는 상위 폴더를 넣으면 어디서든 바로 이동

@ pwd [-P] :: 현재 작업 디렉토리 출력
- -L :: 심볼릭 링크 경로 그대로 (기본)
- -P :: 링크를 해석한 실제 경로
$ cd /opt/app/current && pwd -P   # /opt/app-2.1
$ echo "$PWD"                     # 변수로도 사용

@ pushd <디렉토리> :: 스택에 쌓으며 이동
~ 현재 위치를 디렉토리 스택에 저장하고 이동한다. popd 로 되돌아온다.
- +N :: 스택의 N번째로 회전
- -n :: 이동 없이 스택에만 추가
$ pushd /etc/nginx && pushd /var/log   # → 스택: /var/log /etc/nginx ~ 출력
$ dirs -v                  # 스택 목록 (번호 포함)
@ popd [+N] :: 스택에서 꺼내 이전 위치로
$ popd                     # 직전 pushd 위치로 복귀
@ mkdir [옵션] <디렉토리…> :: 디렉토리 생성
- -p :: 중간 부모까지 생성, 이미 있어도 오류 없음
- -m <모드> :: 권한 지정 (예: 700)
- -v :: 만든 디렉토리 출력
$ mkdir projects   # → projects/ 생성 (출력 없음)
$ mkdir -p src/{api,web,lib}/tests   # 세 개 한 번에
$ mkdir -m 700 ~/.secrets   # → drwx------ 본인만 접근 가능
$ mkdir -p build && cd "$_"          # 만들고 바로 이동

@ rmdir [옵션] <디렉토리…> :: 빈 디렉토리 삭제
~ 비어 있지 않으면 실패하므로 rm -r 보다 안전하다.
- -p :: 비면 부모까지 차례로 삭제
- --ignore-fail-on-non-empty :: 비어 있지 않아도 오류 없이
$ rmdir -p a/b/c   # → c, b, a 순서로 빈 디렉토리 삭제
@ cp [옵션] <원본…> <대상> :: 파일 · 디렉토리 복사
~ 대상이 이미 있는 디렉토리면 그 안으로, 아니면 그 이름으로 복사된다.
- -r / -R :: 디렉토리 재귀 복사
- -a :: 아카이브: 재귀 + 권한·소유자·시각·링크 보존 (백업용)
- -i :: 덮어쓰기 전 확인
- -n :: 기존 파일 덮어쓰지 않음
- -u :: 원본이 더 새롭거나 대상이 없을 때만
- -v :: 복사 과정 출력
- -p :: 권한·시각 보존
- -l / -s :: 복사 대신 하드 / 심볼릭 링크
- --backup=numbered :: 덮어쓸 파일을 .~1~ 로 백업
$ cp app.conf app.conf.bak   # → 같은 위치에 백업 사본 생성
$ cp -r src/ /tmp/src-copy/   # → src 내용이 /tmp/src-copy/ 로
$ cp -av /etc/nginx/ ~/backup/nginx-$(date +%F)/   # → '/etc/nginx/nginx.conf' -> '…/nginx-2026-11-02/…'
$ cp -i *.jpg ~/Pictures/   # → cp: overwrite 'a.jpg'? 로 하나씩 확인
> cp -r src dst 는 dst 가 이미 있으면 dst/src 로 들어간다

@ mv [옵션] <원본…> <대상> :: 이동 · 이름 변경
~ 같은 파일시스템 안에서는 이름만 바뀌어 즉시 끝난다.
- -i :: 덮어쓰기 전 확인
- -n :: 덮어쓰지 않음
- -f :: 묻지 않고 덮어씀
- -u :: 원본이 더 새로울 때만
- -v :: 과정 출력
- -t <디렉토리> :: 대상 먼저 지정 (xargs 와 함께)
$ mv old.txt new.txt                 # 이름 변경
$ mv -i *.pdf ~/Documents/   # → 같은 이름 있으면 overwrite? 질문
$ mv dir1 dir2                       # dir2 가 있으면 그 안으로 이동
$ find . -name '*.tmp' -print0 | xargs -0 mv -t /tmp/trash/   # → .tmp 파일 전부 /tmp/trash/ 로 이동

@ rm [옵션] <파일…> :: 파일 · 디렉토리 삭제
~ 휴지통 없이 즉시 삭제되고 되돌릴 수 없다.
- -r :: 디렉토리와 내용 재귀 삭제
- -f :: 확인 없이, 없는 파일도 오류 없이
- -i :: 파일마다 확인
- -I :: 3개 넘거나 재귀일 때 한 번만 확인
- -d :: 빈 디렉토리 삭제
- -v :: 삭제 과정 출력
- -- :: 이후를 파일명으로 취급 (rm -- -file)
$ rm notes.txt   # → 출력 없이 삭제
$ rm -ri old_project/   # → remove directory 'old_project/'? 하나씩 확인
$ rm -rf node_modules dist   # → 묻지 않고 즉시 삭제
$ rm -- '-weird-name.txt'   # → -로 시작하는 파일도 삭제
> 변수를 쓸 때는 빈 값 방지: rm -rf "${DIR:?}/"
> 지우기 전에 같은 패턴을 ls 로 먼저 확인하는 습관

@ ln [옵션] <대상> <링크이름> :: 링크 만들기
~ 심볼릭 링크는 경로를 가리키는 바로가기, 하드 링크는 같은 파일(inode)의 다른 이름.
- -s :: 심볼릭 링크 (가장 많이 씀)
- -f :: 같은 이름이 있으면 교체
- -n :: 링크가 디렉토리를 가리켜도 링크 자체를 교체
- -r :: 상대 경로 링크로 생성
- -v :: 출력
$ ln -s /opt/node-20/bin/node /usr/local/bin/node   # → node → /opt/node-20/bin/node 링크 생성
$ ln -sfn /opt/app-2.1 /opt/app/current   # 배포 버전 전환
$ readlink -f /usr/bin/python3            # 링크의 최종 대상
> 심볼릭 링크의 상대 경로는 링크가 있는 위치 기준으로 해석된다

@ touch [옵션] <파일…> :: 빈 파일 생성 · 시각 갱신
- -c :: 없으면 만들지 않음
- -d <시각> :: 지정 시각으로 ("2026-01-01 09:00", "yesterday")
- -r <파일> :: 다른 파일의 시각 복사
- -a / -m :: 접근 시각만 / 수정 시각만
$ touch README.md .env   # → 빈 파일 두 개 생성
$ touch -d '2 days ago' old.log   # → 수정 시각이 이틀 전으로 바뀜
$ touch src/{a,b,c}.py   # → src/a.py src/b.py src/c.py 생성

@ tree [옵션] [경로] :: 디렉토리 구조를 트리로
- -L N :: 깊이 제한
- -a :: 숨김 파일 포함
- -d :: 디렉토리만
- -I <패턴> :: 제외 패턴 (| 로 여러 개)
- -h / -s :: 크기 표시 (사람 단위 / 바이트)
- --gitignore :: .gitignore 규칙 적용
$ tree -L 2 -I 'node_modules|.git'   # → ├── src │ └── main.py … 2단계 트리
$ tree -d -L 3 /etc   # → 디렉토리만 3단계 트리
@ stat [옵션] <파일> :: 파일 메타데이터 상세
~ 크기, 블록, inode, 권한, 소유자, atime(접근)·mtime(수정)·ctime(메타 변경) 을 보여준다.
- -c <형식> :: 원하는 항목만 (%n 이름 %s 크기 %a 권한 %y 수정시각)
- -f :: 파일시스템 정보
$ stat app.log   # → Size: 4096 … Modify: 2026-11-02 09:12:01
$ stat -c '%a %U:%G %n' /etc/shadow   # 640 root:shadow /etc/shadow
@ file [옵션] <파일…> :: 내용을 보고 파일 형식 판별
- -i :: MIME 형식으로
- -L :: 링크 대상 검사
$ file /bin/ls photo.jpg data.bin   # → ELF 64-bit… / JPEG image data… / data
$ file -i notes.txt          # text/plain; charset=utf-8
@ realpath <경로> :: 절대 경로로 변환 (링크·.. 해석)
- --relative-to=<dir> :: 기준 디렉토리에서의 상대 경로
$ realpath ../lib   # → /home/kim/lib
$ realpath --relative-to=/home/kim /home/kim/src/app   # → src/app
@ readlink [-f] <링크> :: 심볼릭 링크가 가리키는 대상
- -f :: 끝까지 따라가 최종 절대 경로
$ readlink -f "$(which python3)"   # → /usr/bin/python3.12
@ basename <경로> [접미사] :: 경로에서 파일 이름만
$ basename /var/log/syslog.1          # syslog.1
$ basename report.tar.gz .gz          # report.tar
@ dirname <경로> :: 경로에서 디렉토리 부분만
$ dirname /var/log/syslog             # /var/log
: cd "$(dirname "$0")"                 # 스크립트 위치로 이동
@ install [옵션] <원본> <대상> :: 권한을 지정하며 복사
~ 빌드 결과를 시스템 경로에 넣을 때 쓴다. cp + chmod + chown 을 한 번에.
- -m <모드> :: 권한
- -o / -g :: 소유자 / 그룹
- -d :: 디렉토리 생성
- -D :: 대상 경로의 부모까지 생성
$ sudo install -m 755 build/app /usr/local/bin/app   # → /usr/local/bin/app (rwxr-xr-x)
$ install -Dm644 app.conf ~/.config/app/app.conf   # → ~/.config/app/ 만들고 644 로 복사
@ mktemp [옵션] [템플릿] :: 안전한 임시 파일 · 디렉토리 생성
- -d :: 디렉토리로
- -p <dir> :: 위치 지정
- XXXXXX :: 무작위 문자로 바뀌는 자리
: tmp=$(mktemp -d)
: trap 'rm -rf "$tmp"' EXIT
$ mktemp /tmp/build.XXXXXX   # → /tmp/build.k3J9xQ
@ rename [옵션] '<규칙>' <파일…> :: 여러 파일 이름 일괄 변경
~ 배포판마다 다르다. Debian/Ubuntu 는 Perl 정규식 버전(file-rename).
- -n :: 미리보기만
- -v :: 변경 내역 출력
$ rename -n 's/\.jpeg$/.jpg/' *.jpeg   # → rename(a.jpeg, a.jpg) 미리보기만
$ rename 's/ /_/g' *               # 공백을 _ 로
@ shred [옵션] <파일> :: 덮어써서 복구 불가능하게 삭제
- -u :: 덮어쓴 뒤 삭제
- -n N :: 덮어쓰기 횟수
- -z :: 마지막에 0 으로 덮어 흔적 숨김
$ shred -uz secret.key   # → 덮어쓴 뒤 삭제 (출력 없음)
> SSD · 저널링 파일시스템에서는 완전 삭제를 보장하지 못한다
@ truncate -s <크기> <파일> :: 파일 크기를 정확히 맞춤
- -s 0 :: 내용 비우기 (로그 비울 때)
- -s +10M / -s 1G :: 늘리기 / 지정 크기
$ truncate -s 0 /var/log/app.log      # 프로세스가 열고 있어도 안전하게 비움
$ truncate -s 1G test.img   # → 1GB 빈(희소) 파일 생성
@ chattr [+-=속성] <파일> :: 파일시스템 속성 변경 (ext4)
- +i :: 변경 불가 (root 도 삭제·수정 불가)
- +a :: 추가만 가능 (로그용)
- -R :: 재귀
$ sudo chattr +i /etc/resolv.conf   # → root 도 수정·삭제 불가
@ lsattr [파일] :: 파일시스템 속성 보기
$ lsattr /etc/resolv.conf             # ----i---------e---
@ find [경로…] [조건…] [동작] :: 조건으로 파일 찾기
~ 경로를 재귀 탐색하며 조건을 왼쪽부터 평가한다. 숫자 앞 + 는 초과, - 는 미만.
- -name <패턴> :: 이름 일치 (글롭은 따옴표로 '*.log')
- -iname <패턴> :: 대소문자 무시
- -type f / d / l :: 일반 파일 / 디렉토리 / 심볼릭 링크
- -size +100M / -size -1k :: 크기 초과 / 미만 (c k M G)
- -mtime -7 / -mtime +30 :: 수정 7일 이내 / 30일 넘음
- -mmin -10 :: 10분 이내 수정
- -newer <파일> :: 그 파일보다 최근 수정
- -user <이름> / -group <그룹> :: 소유자 / 그룹
- -perm 644 / -perm -u+x :: 권한 정확히 / 포함
- -empty :: 빈 파일·디렉토리
- -maxdepth N :: 탐색 깊이 제한 (조건보다 앞에)
- -path <패턴> -prune -o :: 특정 디렉토리 건너뛰기
- ! / -o / \( … \) :: NOT / OR / 묶기
- -print0 :: NUL 구분 출력 (xargs -0 과 짝)
- -exec cmd {} \; :: 찾은 것마다 cmd 실행
- -exec cmd {} + :: 모아서 한 번에 실행 (빠름)
- -delete :: 삭제 (조건 맨 뒤에)
$ find . -name '*.py'   # → ./app/main.py ./tests/test_main.py …
$ find /var/log -type f -size +100M   # → 100MB 넘는 로그 경로 목록
$ find . -type f -mtime +30 -name '*.log' -delete   # → 30일 지난 .log 삭제 (출력 없음)
$ find . -maxdepth 2 -type d -name node_modules   # → ./node_modules ./web/node_modules
$ find . -path ./.git -prune -o -type f -print   # → .git 안을 뺀 모든 파일
$ find . -type f \( -name '*.jpg' -o -name '*.png' \)   # → jpg·png 파일 목록
$ find src -name '*.ts' -exec grep -l 'TODO' {} +   # → TODO 가 있는 .ts 파일 이름
$ find /tmp -user "$USER" -empty -delete   # → 내 소유 빈 파일·폴더 삭제
> -delete 전에는 같은 조건으로 출력만 해서 확인


# 파일 내용 보기 · 비교 | core
@ cat [옵션] <파일…> :: 파일 출력 · 이어붙이기
- -n :: 모든 줄에 번호
- -b :: 비어있지 않은 줄에만 번호
- -A :: 숨은 문자 표시 (탭 ^I, 줄끝 $, CR ^M)
- -s :: 연속된 빈 줄을 하나로
$ cat /etc/os-release   # → NAME="Ubuntu" VERSION="24.04 LTS" …
$ cat part1 part2 > full.txt   # → 두 파일을 이어 full.txt 생성
$ cat -A script.sh | head   # 윈도우 줄바꿈(^M) 확인
: cat > note.txt <<'EOF'
: 여러 줄을 한 번에 파일로
: EOF
> 큰 파일은 less, 앞뒤만 볼 땐 head / tail

@ tac <파일> :: 마지막 줄부터 거꾸로 출력
$ tac app.log | grep -m1 ERROR        # 가장 최근 에러 한 줄
@ less [옵션] <파일> :: 페이지 단위로 읽기
~ 파일 전체를 읽지 않아 큰 로그도 빠르다. 파이프 출력도 받는다.
- -N :: 줄 번호
- -S :: 긴 줄 자르기 (← → 로 가로 이동)
- -R :: 색상 코드 표시
- -i :: 검색 시 대소문자 무시
- +F :: 끝에서 추적 시작 (tail -f 처럼)
- Space / b :: 다음 / 이전 페이지
- g / G :: 맨 처음 / 맨 끝
- /패턴 / ?패턴 :: 아래 / 위로 검색
- n / N :: 다음 / 이전 검색 결과
- &패턴 :: 일치하는 줄만 표시
- F :: 추적 모드 (Ctrl+C 로 해제)
- q :: 종료
$ less -N /etc/nginx/nginx.conf   # → 줄 번호와 함께 페이지 보기
$ journalctl -u app | less -S   # → 긴 줄을 자르지 않고 가로 스크롤
$ git log | less +/fix   # → 'fix' 첫 위치에서 열림

@ more <파일> :: 단순 페이지 보기 (Space 다음, q 종료)
> 거의 모든 시스템에 있지만 뒤로 가기·검색은 less 가 편하다
@ head [옵션] <파일…> :: 앞부분 출력 (기본 10줄)
- -n N :: 처음 N줄
- -n -N :: 마지막 N줄만 빼고 전부
- -c N :: 처음 N바이트
- -q :: 여러 파일일 때 파일명 머리말 숨김
$ head -n 20 data.csv   # → 처음 20줄 (헤더 포함)
$ head -1 data.csv | tr ',' '\n'   # CSV 헤더 열 목록
$ ps aux --sort=-%mem | head -6   # → 메모리 많이 쓰는 5개 + 헤더

@ tail [옵션] <파일…> :: 뒷부분 출력 · 실시간 추적
- -n N :: 마지막 N줄
- -n +N :: N번째 줄부터 끝까지 (헤더 빼기)
- -f :: 내용이 추가되면 계속 출력
- -F :: 파일이 교체(로그 로테이트)돼도 다시 열어 추적
- --pid=PID :: 그 프로세스가 끝나면 종료
- -s 초 :: 확인 간격
$ tail -n 100 app.log   # → 마지막 100줄
$ tail -f /var/log/syslog   # → 새 로그가 생기는 대로 출력 (Ctrl+C 종료)
$ tail -F access.log | grep --line-buffered ' 500 '   # → 500 응답이 들어올 때마다 출력
$ tail -n +2 data.csv > body.csv   # 헤더 줄 제거
$ tail -f a.log b.log              # 여러 파일 동시

@ nl [옵션] <파일> :: 줄 번호 붙이기
- -ba :: 빈 줄에도 번호
- -w N / -s <문자> :: 번호 폭 / 구분 문자
$ nl -ba script.sh | sed -n '40,50p'   # → 40~50번 줄을 번호와 함께
@ diff [옵션] <파일1> <파일2> :: 두 파일 차이 비교
~ 같으면 종료 코드 0, 다르면 1. 기본 출력의 < 는 파일1, > 는 파일2.
- -u :: unified 형식 (+/- 표시, 패치·리뷰용)
- -y :: 좌우 나란히 (-W 로 폭 지정)
- -r :: 디렉토리 재귀 비교
- -q :: 다른지 여부만
- -i / -w / -B :: 대소문자 / 공백 / 빈 줄 차이 무시
- --color :: 색상
- -N :: 한쪽에만 있는 파일도 비교 (-r 과 함께)
$ diff -u old.conf new.conf   # → -old 줄 / +new 줄 형식 차이
$ diff -rq dirA/ dirB/   # → Files dirA/x and dirB/x differ / Only in dirA: y
$ diff <(sort a.txt) <(sort b.txt)   # 정렬 후 비교
$ diff -u a.c b.c > fix.patch && patch -p0 < fix.patch   # → 패치 만들고 바로 적용

@ cmp [옵션] <파일1> <파일2> :: 바이트 단위 비교
- -s :: 출력 없이 종료 코드만
- -l :: 다른 바이트 모두 출력
$ cmp a.bin b.bin                     # 처음 다른 위치
@ comm [옵션] <정렬파일1> <정렬파일2> :: 두 목록의 공통 · 차이
~ 세 열 출력: 1 에만 있음 / 2 에만 있음 / 둘 다. 숨길 열 번호를 옵션으로.
- -12 :: 공통 줄만
- -23 :: 첫 파일에만 있는 줄
- -13 :: 둘째 파일에만 있는 줄
$ comm -12 <(sort a.txt) <(sort b.txt)   # → 두 파일에 모두 있는 줄
$ comm -23 <(sort all.txt) <(sort done.txt)   # 남은 작업
@ patch [옵션] < <패치파일> :: diff 결과를 파일에 적용
- -p N :: 경로 앞 N단계 제거 (git diff 는 -p1)
- -R :: 되돌리기
- --dry-run :: 적용 가능한지만 확인
- -b :: 원본 백업 (.orig)
$ patch -p1 --dry-run < fix.patch && patch -p1 < fix.patch   # → checking file … 확인 후 실제 적용
@ xxd [옵션] <파일> :: 16진수 덤프 · 역변환
- -l N :: 처음 N바이트
- -s N :: N바이트 건너뛰고
- -r :: 덤프를 바이너리로 되돌림
- -p :: 순수 16진수만
$ xxd -l 32 image.png   # → 00000000: 8950 4e47 0d0a 1a0a  .PNG....
$ echo -n 'hi' | xxd -p               # 6869
@ hexdump [-C] <파일> :: 16진 + ASCII 덤프
$ hexdump -C firmware.bin | head   # → 00000000  7f 45 4c 46 …  |.ELF…|
@ od [옵션] <파일> :: 8진 · 16진 · 문자 덤프
- -c :: 문자로 (제어문자 \n \r 확인)
- -An -tx1 :: 주소 없이 16진 1바이트씩
$ printf 'a\tb\r\n' | od -c   # → a  \t  b  \r  \n
@ strings [옵션] <파일> :: 바이너리 안의 문자열 추출
- -n N :: 최소 N글자
$ strings -n 8 app.bin | grep -i version   # → version 2.4.1 같은 내장 문자열
@ split [옵션] <파일> [접두사] :: 큰 파일을 여러 조각으로
- -b 100M :: 크기 단위로
- -l 10000 :: 줄 수 단위로
- -n 4 :: N등분
- -d :: 숫자 접미사 (00, 01…)
$ split -b 1G -d backup.tar part_   # → part_00 part_01 … (1GB 씩)
$ cat part_* > backup.tar             # 다시 합치기

# 검색 · 위치 찾기 | core
@ locate [옵션] <패턴> :: 파일 이름 DB 에서 빠르게 검색
~ 미리 만든 DB 를 검색하므로 매우 빠르지만 최신이 아닐 수 있다. sudo updatedb 로 갱신.
- -i :: 대소문자 무시
- -c :: 개수만
- -r <정규식> :: 정규식
$ locate -i nginx.conf   # → /etc/nginx/nginx.conf …
$ sudo updatedb && locate '*.desktop' | wc -l   # → DB 갱신 후 .desktop 개수 (예: 214)
@ which [-a] <명령> :: PATH 에서 실행 파일 위치
- -a :: 일치하는 것 모두
$ which -a python3   # → /usr/bin/python3 /bin/python3
@ whereis <명령> :: 실행 파일 · 소스 · 매뉴얼 위치
$ whereis nginx   # → nginx: /usr/sbin/nginx /etc/nginx /usr/share/man/…
@ type [-a] <이름> :: 명령의 정체 (alias · 함수 · 내장 · 파일)
$ type ll cd ls                       # ll is aliased to 'ls -alF'
@ rg [옵션] <패턴> [경로] :: ripgrep — 빠른 재귀 grep
~ .gitignore 와 숨김 파일을 기본으로 건너뛴다. 대규모 코드 검색에 최적.
- -i / -S :: 대소문자 무시 / 스마트 (대문자 있으면 구분)
- -t <형식> / -T <형식> :: 그 형식만 / 제외 (py, js, rust…)
- -g '<글롭>' :: 글롭 필터 (! 로 제외)
- -F / -w :: 고정 문자열 / 단어 단위
- -l / -c :: 파일명만 / 개수
- -C N :: 앞뒤 문맥
- --hidden / -uuu :: 숨김 포함 / 모든 무시 규칙 해제
- -r '<치환>' :: 출력만 치환해서 보기
$ rg 'useEffect' -t ts   # → src/App.tsx:12:  useEffect(() => {
$ rg -l 'TODO' -g '!vendor/'   # → TODO 있는 파일 이름 (vendor 제외)
$ rg -F 'a.b(c)' --hidden   # → 특수문자 그대로 검색, 숨김 파일 포함
@ fd [옵션] [패턴] [경로] :: 빠르고 쉬운 find
~ 정규식 패턴, .gitignore 존중, 색상 출력. Debian 에서는 fdfind 이름.
- -e <확장자> :: 확장자로
- -t f / -t d :: 파일 / 디렉토리
- -H / -I :: 숨김 포함 / 무시 규칙 해제
- -x <명령> / -X <명령> :: 결과마다 / 모아서 실행
$ fd -e py test   # → 이름에 test 가 들어간 .py
$ fd -t f -e log -x rm {}   # → 모든 .log 파일 삭제
@ fzf [옵션] :: 대화형 퍼지 검색 선택기
~ 입력 목록에서 타이핑으로 걸러 선택한다. Ctrl+R(히스토리), Ctrl+T(파일) 키 바인딩 제공.
- -m :: 여러 개 선택 (Tab)
- --preview '<명령>' :: 미리보기 창
$ vim "$(fzf --preview 'head -50 {}')"   # → 미리보기로 고른 파일을 vim 으로 열기
$ git branch | fzf | xargs git switch   # → 고른 브랜치로 전환

# 텍스트 처리 | text
@ grep [옵션] <패턴> [파일…] :: 패턴이 있는 줄 찾기
~ 기본은 기본 정규식(BRE). -E 를 주면 + ? | ( ) 를 그대로 쓰는 확장 정규식.
- -i :: 대소문자 무시
- -v :: 일치하지 않는 줄
- -r :: 디렉토리 재귀 검색
- -n :: 줄 번호 표시
- -c :: 일치한 줄 수만
- -l / -L :: 일치하는 / 일치하지 않는 파일 이름만
- -w :: 단어 단위 일치 (error ≠ errors)
- -x :: 줄 전체가 일치
- -o :: 일치한 부분만 출력
- -E :: 확장 정규식
- -F :: 정규식이 아닌 고정 문자열 (빠르고 특수문자 안전)
- -P :: Perl 정규식 (\d \s 전방탐색)
- -A N / -B N / -C N :: 뒤 / 앞 / 앞뒤 N줄 함께
- -e <패턴> :: 패턴 여러 개
- --include='*.py' :: 그 파일만 (-r 과 함께)
- --exclude-dir=<dir> :: 디렉토리 제외
- -q :: 출력 없이 종료 코드만 (if 문용)
$ grep -rn 'TODO' src/   # → src/app.js:42:// TODO 리팩터링
$ grep -i 'error' app.log | tail   # → error 포함 줄 마지막 10개
$ grep -v '^#' nginx.conf | grep -v '^$'   # 주석·빈 줄 제외
$ grep -E 'WARN|ERROR' app.log   # → WARN 또는 ERROR 줄
$ grep -C 3 'Exception' app.log   # → Exception 앞뒤 3줄씩
$ grep -rl --include='*.js' --exclude-dir=node_modules 'fetch(' .   # → fetch( 쓰는 .js 파일 이름
$ grep -oE '[0-9]+ms' perf.log | sort -n | tail -1   # → 가장 큰 응답 시간 (예: 1830ms)
: if grep -q '^kim:' /etc/passwd; then echo '사용자 있음'; fi
> 큰 코드베이스에서는 rg(ripgrep) 가 더 빠르고 .gitignore 를 존중한다

@ sed [옵션] '<명령>' [파일…] :: 스트림 편집 (치환 · 삭제 · 추출)
~ 줄 단위로 읽어 명령을 적용하고 출력한다. 원본 파일은 -i 를 줘야 바뀐다.
- -i :: 파일을 직접 수정
- -i.bak :: 수정 전 .bak 백업
- -n :: 자동 출력 끔 (p 명령과 함께)
- -E :: 확장 정규식 (그룹을 \( \) 없이)
- -e :: 명령 여러 개
- s/old/new/ :: 줄마다 첫 번째만 치환
- s/old/new/g :: 모두 치환 (I: 대소문자 무시)
- s|/a|/b|g :: 구분자 변경 (경로에 유용)
- & / \1 :: 일치 전체 / 첫 번째 그룹
- Nd / N,Md :: N번째 / N~M번째 줄 삭제
- /패턴/d :: 패턴 있는 줄 삭제
- Np / $p :: N번째 / 마지막 줄 출력
- /시작/,/끝/p :: 범위 출력
- Ni\텍스트 / Na\텍스트 :: N번째 줄 앞 / 뒤에 삽입
$ sed 's/http:/https:/g' urls.txt   # → http: 가 https: 로 바뀐 내용 출력
$ sed -i 's/^PORT=.*/PORT=8080/' .env   # → .env 의 PORT 줄이 PORT=8080 으로
$ sed -i.bak '/^#/d; /^$/d' app.conf   # → 주석·빈 줄 제거, app.conf.bak 백업
$ sed -n '100,120p' big.log   # → 100~120번 줄만
$ sed -n '/BEGIN/,/END/p' cert.pem   # → -----BEGIN … END----- 블록
$ sed -E 's/([0-9]{4})-([0-9]{2})-([0-9]{2})/\3.\2.\1/' dates.txt   # → 2026-11-02 가 02.11.2026 으로
$ sed -i '1i #!/usr/bin/env bash' run.sh   # → 첫 줄에 #!/usr/bin/env bash 추가
> macOS(BSD) sed 는 -i '' 처럼 빈 접미사를 줘야 한다

@ awk [옵션] '<패턴> { 동작 }' [파일…] :: 필드(열) 단위 처리
~ 각 줄을 공백 기준으로 나눠 $1 $2 … 로 다룬다. 패턴이 참인 줄에만 동작을 실행.
- -F <구분자> :: 필드 구분자 (-F: , -F, , -F'\t')
- -v 변수=값 :: 외부 값 전달
- $0 :: 줄 전체
- $1 … $NF :: n번째 필드 / 마지막 필드
- NR :: 현재 줄 번호
- NF :: 현재 줄의 필드 개수
- OFS :: 출력 구분자 (기본 공백)
- BEGIN { } / END { } :: 시작 전 / 끝난 후 실행
- printf :: 형식 출력 ("%-10s %5d\n")
- 연산자 :: == != ~ !~ && || + - * / %
$ awk '{print $1}' access.log                 # 첫 열(IP)
$ awk -F: '{print $1, $7}' /etc/passwd         # 사용자와 셸
$ awk '$9 == 500' access.log                   # 상태코드 500 줄
$ awk 'NR > 1 {sum += $3} END {print sum}' data.tsv   # → 셋째 열 합계 (헤더 제외)
$ awk '{c[$1]++} END {for (ip in c) print c[ip], ip}' access.log | sort -rn | head   # → 532 203.0.113.7 … 요청 많은 IP
$ awk -F, -v OFS=',' '{print $2, $1}' in.csv   # → 1·2열을 바꾼 CSV
$ df -h | awk 'NR>1 && $5+0 > 80 {print $6, $5}'   # → / 87% 처럼 80% 넘는 디스크
$ awk '!seen[$0]++' list.txt                   # 정렬 없이 중복 제거

@ sort [옵션] [파일…] :: 줄 정렬
- -n :: 숫자로 정렬 (10 > 9)
- -h :: 사람 단위 크기 (1K < 2M < 3G)
- -r :: 내림차순
- -k N / -k N,M :: N번째 필드 기준 / N~M 필드
- -t <구분자> :: 필드 구분자
- -u :: 정렬 후 중복 제거
- -f :: 대소문자 무시
- -V :: 버전 정렬 (v1.9 < v1.10)
- -o <파일> :: 결과를 파일로 (원본 덮어쓰기 가능)
- -R :: 무작위 섞기
$ sort -n -r scores.txt   # → 큰 숫자부터
$ du -sh * | sort -h   # → 4.0K docs … 1.2G videos (작은 것부터)
$ sort -t, -k3,3nr sales.csv | head      # 3열 숫자 내림차순
$ sort -u -o list.txt list.txt   # → 정렬·중복 제거해 원본에 덮어씀

@ uniq [옵션] [입력] [출력] :: 인접한 중복 줄 처리
~ 붙어 있는 중복만 본다. 그래서 보통 sort 뒤에 쓴다.
- -c :: 줄마다 등장 횟수
- -d :: 중복된 줄만 (한 번씩)
- -u :: 한 번만 나온 줄만
- -i :: 대소문자 무시
$ sort access.log | uniq -c | sort -rn | head    # 빈도 Top 10
$ sort emails.txt | uniq -d                      # 중복 이메일
$ cut -d' ' -f1 access.log | sort | uniq -c | sort -rn | head -5   # → 요청 수 상위 5개 IP

@ cut [옵션] [파일…] :: 열 · 문자 잘라내기
- -d <문자> :: 구분자 (기본 탭, 한 글자만)
- -f <목록> :: 필드 선택 (1 / 1,3 / 2-4 / 3-)
- -c <목록> :: 문자 위치 선택 (1-10)
- --complement :: 선택을 반대로
$ cut -d: -f1 /etc/passwd   # → root daemon … kim
$ cut -d, -f1,3 users.csv   # → 1·3열만 (id,email)
$ cut -c1-8 hashes.txt   # → 각 줄 앞 8글자
> 공백이 여러 개인 열은 cut 대신 awk '{print $2}'

@ wc [옵션] [파일…] :: 줄 · 단어 · 바이트 세기
- -l :: 줄 수
- -w :: 단어 수
- -c :: 바이트 수
- -m :: 문자 수 (한글은 바이트 수와 다름)
- -L :: 가장 긴 줄 길이
$ wc -l app.log   # → 15230 app.log
$ ls | wc -l                       # 파일 개수
$ git ls-files '*.py' | xargs wc -l | sort -n | tail   # → 줄 수 많은 .py 파일 + total

@ tr [옵션] <집합1> [집합2] :: 문자 단위 변환 · 삭제
~ 파일 인자를 받지 않으므로 < 로 입력한다.
- 'a-z' 'A-Z' :: 소문자를 대문자로
- -d <집합> :: 그 문자 삭제
- -s <집합> :: 연속된 같은 문자를 하나로
- -c :: 집합의 여집합
- [:digit:] [:space:] [:alpha:] :: 문자 클래스
$ tr 'a-z' 'A-Z' < in.txt   # → 전부 대문자로
$ tr -d '\r' < win.txt > unix.txt   # → \r 제거된 unix.txt 생성
$ tr -s ' ' < table.txt | cut -d' ' -f2   # → 공백을 하나로 줄여 둘째 열
$ echo "$PATH" | tr ':' '\n'   # → PATH 항목을 한 줄에 하나씩
@ tee [옵션] <파일…> :: 화면에 출력하면서 파일에도 저장
- -a :: 이어쓰기
$ ./build.sh 2>&1 | tee build.log   # → 화면에 보이면서 build.log 에도 저장
$ echo '127.0.0.1 dev.local' | sudo tee -a /etc/hosts   # → /etc/hosts 끝에 한 줄 추가
@ paste [옵션] <파일…> :: 파일을 열(가로)로 붙이기
- -d <구분자> :: 구분자 (기본 탭)
- -s :: 한 파일의 줄을 한 줄로
$ paste names.txt ages.txt   # → kim	30 (탭으로 나란히)
$ paste -sd, ids.txt                  # 1,2,3,4
$ paste -sd+ nums.txt | bc            # 합계
@ join [옵션] <파일1> <파일2> :: 공통 키로 두 파일 결합 (SQL JOIN)
- -t <구분자> :: 구분자
- -1 N / -2 N :: 각 파일의 키 열
- -a 1 :: 짝 없는 줄도 출력 (LEFT JOIN)
$ join -t, <(sort users.csv) <(sort orders.csv)   # → 같은 키끼리 합친 줄
> 두 파일 모두 키 기준 정렬돼 있어야 한다
@ column [옵션] :: 표 형태로 정렬
- -t :: 열 맞춤
- -s <구분자> :: 입력 구분자
- -o <구분자> :: 출력 구분자
$ column -t -s, data.csv | less -S   # → 열 맞춘 표로 보기
$ mount | column -t   # → 열 맞춘 마운트 목록
@ fold [옵션] <파일> :: 긴 줄을 폭에 맞게 접기
- -w N :: 폭
- -s :: 공백에서 접기
$ fold -s -w 80 README.txt   # → 80칸에서 단어 단위로 줄바꿈
@ fmt [-w N] <파일> :: 문단을 정해진 폭으로 다시 정렬
$ fmt -w 72 commit-msg.txt   # → 72칸 문단으로 다시 정렬
@ expand / unexpand :: 탭 ↔ 공백 변환
- -t N :: 탭 폭
$ expand -t 4 Makefile.txt   # → 탭이 공백 4칸으로
@ rev [파일] :: 줄마다 글자 순서 뒤집기
$ echo 'a/b/c.txt' | rev | cut -d/ -f1 | rev   # 마지막 필드
@ shuf [옵션] [파일] :: 줄을 무작위로 섞기 · 뽑기
- -n N :: N개만
- -i 1-100 :: 숫자 범위에서
$ shuf -n 3 names.txt   # → 무작위 이름 3개
$ shuf -i 1-45 -n 6 | sort -n        # 로또 번호
@ seq [시작] [간격] <끝> :: 숫자 수열
- -w :: 자릿수 맞춤 (01 02 …)
- -s <구분자> :: 구분자
$ seq 5                               # 1 2 3 4 5 (줄마다)
$ seq -w 0 5 100   # → 000 005 010 … 100
$ for i in $(seq 1 10); do echo "job $i"; done   # → job 1 … job 10
@ printf '<형식>' [인자…] :: 형식 지정 출력
- %s %d %f :: 문자열 / 정수 / 실수
- %-10s %5.2f :: 왼쪽 정렬 10칸 / 폭 5 소수 2자리
- %x %o %e :: 16진 / 8진 / 지수
- \n \t :: 줄바꿈 / 탭
$ printf '%-10s|%5d\n' apple 3 banana 12   # → apple     |    3 / banana    |   12
$ printf '%04d\n' 7                   # 0007
@ echo [옵션] [문자열…] :: 문자열 출력
- -n :: 끝에 줄바꿈 안 함
- -e :: \n \t 같은 이스케이프 해석
$ echo "Hello, $USER"   # → Hello, kim
$ echo -e "이름\t나이\n김\t30"   # → 이름  나이 / 김  30
$ echo 'export EDITOR=vim' >> ~/.bashrc   # → ~/.bashrc 끝에 줄 추가
$ echo $?                          # 직전 명령 종료 코드
$ printf '%s=%d\n' count 42        # 형식이 필요하면 printf
> 작은따옴표 안은 변수가 확장되지 않는다: '$HOME' 은 글자 그대로

@ jq [옵션] '<필터>' [파일] :: JSON 조회 · 가공
~ JSON 을 파이프로 다루는 표준 도구. 필터는 . 에서 시작한다.
- . :: 보기 좋게 출력
- .key / .a.b / .[0] :: 키 / 중첩 / 인덱스
- .[] :: 배열 펼치기
- select(조건) :: 걸러내기
- map(식) / length / keys :: 변환 / 길이 / 키 목록
- -r :: 따옴표 없이 문자열 출력
- -c :: 한 줄 JSON
- --arg 이름 값 :: 외부 변수
$ curl -s api/users | jq '.[0]'   # → 첫 번째 사용자 객체 (색상 JSON)
$ jq -r '.[] | select(.age > 30) | .name' users.json   # → 30세 넘는 사람 이름만
$ jq '.items | length' resp.json   # → 42
$ jq --arg v "$VER" '.version = $v' package.json > tmp && mv tmp package.json   # → version 필드를 $VER 로 수정
@ yq [옵션] '<필터>' [파일] :: YAML 용 jq
- -i :: 파일 직접 수정
- -o json :: JSON 으로 출력
$ yq '.spec.replicas' deploy.yaml   # → 3
$ yq -i '.image.tag = "1.2.0"' values.yaml   # → values.yaml 의 image.tag 수정
@ iconv -f <원본> -t <대상> [파일] :: 문자 인코딩 변환
- -l :: 지원 인코딩 목록
- //TRANSLIT :: 대응 없는 문자는 비슷하게
$ iconv -f CP949 -t UTF-8 old.csv > new.csv   # → 한글 깨짐 없는 UTF-8 파일
@ dos2unix / unix2dos <파일> :: 줄바꿈 CRLF ↔ LF 변환
$ dos2unix deploy.sh                  # ^M: bad interpreter 해결
@ envsubst [변수목록] :: 텍스트의 $변수를 환경 값으로 치환
$ export HOST=api.local; envsubst < nginx.tmpl > nginx.conf   # → ${HOST} 가 api.local 로 채워진 설정
$ envsubst '$HOST $PORT' < tmpl      # 지정한 변수만
@ xargs [옵션] [명령 [인자…]] :: 표준입력을 명령 인자로 변환
~ 파이프로 받은 목록을 명령의 인자로 붙여 실행한다. 너무 많으면 나눠서 실행.
- -n N :: 한 번에 N개씩
- -I {} :: {} 자리에 하나씩 넣어 실행
- -0 :: NUL 구분 입력 (find -print0, 공백 파일명 안전)
- -P N :: N개 병렬 실행
- -r :: 입력이 없으면 실행하지 않음
- -p / -t :: 실행 전 확인 / 실행할 명령 출력
$ find . -name '*.log' -print0 | xargs -0 rm -f   # → 공백 있는 이름도 안전하게 삭제
$ cat urls.txt | xargs -n1 -P8 curl -sO   # → URL 8개씩 동시에 다운로드
$ git branch --merged | grep -v main | xargs -r git branch -d   # → Deleted branch feature/x (was a1b2c3d).
$ docker ps -aq | xargs -r docker rm -f   # → 모든 컨테이너 삭제 (없으면 아무것도 안 함)



# 미디어 · 문서 변환 | text
@ ffmpeg [옵션] -i <입력> [옵션] <출력> :: 영상 · 음성 변환의 표준 도구
- -c copy :: 재인코딩 없이 복사 (빠름)
- -ss / -to :: 시작 / 끝 시각
- -vn / -an :: 영상 제거 / 소리 제거
- -vf scale=1280:-2 :: 크기 조정
- -crf 23 :: 화질 (낮을수록 고화질)
$ ffmpeg -i in.mov -c:v libx264 -crf 23 -c:a aac out.mp4   # → H.264 mp4 로 변환
$ ffmpeg -ss 00:01:00 -to 00:02:30 -i in.mp4 -c copy clip.mp4   # → 1:00~2:30 구간을 재인코딩 없이 잘라냄
$ ffmpeg -i talk.mp4 -vn -q:a 2 talk.mp3   # → 음성만 mp3 로 추출
@ magick <입력> [옵션] <출력> :: ImageMagick 이미지 변환 (구버전 convert)
- -resize 50% / 800x :: 크기
- -quality 85 :: 품질
$ magick photo.png -resize 1200x -quality 85 photo.jpg   # → 폭 1200px JPG
$ magick mogrify -format webp *.png   # → 모든 png 옆에 .webp 생성
@ pandoc <입력> -o <출력> :: 문서 형식 변환 (md · docx · pdf · html)
$ pandoc README.md -o README.docx   # → README.docx
$ pandoc notes.md -s -o notes.html   # → 단독 실행 가능한 notes.html
@ pdftotext [옵션] <PDF> [출력] :: PDF 텍스트 추출 (poppler-utils)
- -layout :: 배치 유지
$ pdftotext -layout invoice.pdf - | grep 합계   # → 합계 1,250,000 원 줄
@ qrencode [옵션] <텍스트> :: QR 코드 생성
- -t ansiutf8 :: 터미널에 바로 출력
$ qrencode -t ansiutf8 'https://example.com'   # → 터미널에 QR 코드가 그려짐

# 압축 · 아카이브 | core
@ tar [옵션] [파일…] :: 묶기(아카이브) · 압축 · 풀기
~ c(만들기) x(풀기) t(목록) 중 하나와 f 아카이브 이름. 압축 방식은 z j J 로 고른다.
- -c / -x / -t :: 만들기 / 풀기 / 목록 보기
- -f <파일> :: 아카이브 파일 지정 (옵션 묶음의 마지막에)
- -z :: gzip (.tar.gz, .tgz)
- -j :: bzip2 (.tar.bz2)
- -J :: xz (.tar.xz, 높은 압축률)
- --zstd :: zstd (.tar.zst, 빠름)
- -v :: 처리하는 파일 출력
- -C <디렉토리> :: 그 위치로 이동해서 작업
- --exclude=<패턴> :: 제외
- --strip-components=N :: 경로 앞 N단계 제거
$ tar -czvf backup.tar.gz project/   # → project/… 파일 목록 출력하며 압축
$ tar -xzvf backup.tar.gz   # → 현재 위치에 풀림
$ tar -xf archive.tar.xz -C /opt   # → /opt 아래에 풀림
$ tar -tzf backup.tar.gz | less   # → 아카이브 안 파일 목록
$ tar -czf src.tgz --exclude=node_modules src/   # → node_modules 뺀 압축 파일
$ tar -czf - dir | ssh host 'tar -xzf - -C /backup'   # → 원격 /backup 에 바로 풀림
> 외우기: czf 만들기, xzf 풀기, tzf 들여다보기

@ gzip [옵션] <파일…> :: .gz 압축 (원본은 사라짐)
- -d :: 풀기 (= gunzip)
- -k :: 원본 유지
- -1 … -9 :: 빠름 … 최대 압축
- -r :: 디렉토리 안 파일 각각
- -l :: 압축률 정보
$ gzip -k access.log   # → access.log.gz 생성, 원본 유지
$ gzip -9 dump.sql   # → dump.sql.gz (원본 사라짐)
@ gunzip <파일.gz> :: .gz 풀기
$ gunzip -k data.csv.gz   # → data.csv 복원, .gz 유지
@ zcat / zless / zgrep :: 압축을 풀지 않고 보기 · 검색
$ zcat access.log.2.gz | wc -l   # → 압축 풀지 않고 줄 수
$ zgrep -i 'error' /var/log/syslog.*.gz   # → 압축 로그에서 error 줄
@ bzip2 [옵션] <파일> :: .bz2 압축 (-d 풀기, -k 원본 유지)
@ xz [옵션] <파일> :: .xz 고압축
- -d / -k :: 풀기 / 원본 유지
- -T0 :: 모든 코어 사용
- -9e :: 최대 압축
$ xz -T0 -k big.img   # → big.img.xz 생성 (모든 코어)
@ zstd [옵션] <파일> :: .zst 빠르고 효율적인 압축
- -d :: 풀기
- -19 / --ultra -22 :: 높은 압축
- -T0 :: 멀티스레드
- --rm :: 원본 삭제
$ zstd -T0 -19 backup.tar   # → backup.tar.zst
$ tar --zstd -cf src.tar.zst src/   # → src.tar.zst
@ zip [옵션] <아카이브.zip> <파일…> :: .zip 만들기
- -r :: 디렉토리 재귀
- -x <패턴> :: 제외
- -e :: 암호 걸기
- -9 :: 최대 압축
- -u :: 바뀐 파일만 갱신
$ zip -r site.zip public/ -x '*.map' -x '.DS_Store'   # → adding: public/index.html (deflated 62%) …
@ unzip [옵션] <아카이브.zip> :: .zip 풀기
- -l :: 목록만
- -d <디렉토리> :: 풀 위치
- -o / -n :: 묻지 않고 덮어쓰기 / 덮어쓰지 않기
- -O cp949 :: 윈도우 한글 파일명 깨짐 방지
$ unzip -l release.zip   # → Length  Date  Time  Name 목록
$ unzip -q release.zip -d /opt/app   # → /opt/app 에 조용히 풀림
$ unzip -O cp949 한글.zip   # → 한글 파일명이 깨지지 않음
@ 7z <명령> <아카이브> [파일] :: 7-Zip (.7z .rar 등 다양한 형식)
- a / x / l :: 압축 / 경로 유지해 풀기 / 목록
- -p<암호> :: 암호
$ 7z a backup.7z docs/   # → backup.7z 생성
$ 7z x archive.rar -o./out   # → ./out 에 풀림


# 해시 · 암호화 · 키 | sys
@ sha256sum [옵션] <파일…> :: SHA-256 체크섬 계산 · 검증
~ 다운로드한 파일이 손상·변조되지 않았는지 확인한다. sha1sum, sha512sum 도 같은 사용법.
- -c <목록파일> :: 목록의 체크섬과 비교
- --quiet :: 실패만 출력
$ sha256sum ubuntu.iso   # → e3b0c4…  ubuntu.iso
$ sha256sum -c SHA256SUMS --ignore-missing   # → ubuntu.iso: OK
$ echo -n 'hello' | sha256sum   # → 2cf24dba5fb0a30e…  -
@ md5sum [옵션] <파일…> :: MD5 체크섬 (보안용 X, 동일성 확인용)
$ md5sum *.jpg | sort | uniq -w32 -d   # 내용이 같은 파일 찾기
@ base64 [옵션] [파일] :: Base64 인코딩 · 디코딩
- -d :: 디코딩
- -w 0 :: 줄바꿈 없이 한 줄로
$ echo -n 'user:pass' | base64        # dXNlcjpwYXNz
$ echo 'dXNlcjpwYXNz' | base64 -d   # → user:pass
$ base64 -w0 logo.png > logo.b64   # → 한 줄짜리 Base64 텍스트 파일
@ gpg <동작> [파일] :: GnuPG 서명 · 암호화
- -c :: 암호(대칭키)로 암호화
- -d :: 복호화
- -e -r <수신자> :: 공개키로 암호화
- --sign / --verify :: 서명 / 검증
- --full-generate-key :: 키 쌍 생성
- -k / -K :: 공개키 / 비밀키 목록
- --export -a <ID> :: 공개키 내보내기
$ gpg -c --cipher-algo AES256 secrets.tar   # → 암호 입력 → secrets.tar.gpg
$ gpg -d secrets.tar.gpg > secrets.tar   # → 암호 입력 → 원본 복원
$ gpg --verify app.tar.gz.sig app.tar.gz   # → Good signature from "…"
@ openssl <명령> [옵션] :: TLS · 인증서 · 암호 도구
- s_client -connect host:443 :: TLS 접속 테스트
- x509 -in cert.pem -noout -text :: 인증서 내용
- req -x509 -newkey rsa:4096 :: 자체 서명 인증서 생성
- rand -hex 32 :: 무작위 값
- enc -aes-256-cbc -pbkdf2 :: 파일 암호화
$ openssl s_client -connect example.com:443 -servername example.com </dev/null   # → 인증서 체인과 TLS 버전 출력
$ echo | openssl s_client -connect example.com:443 2>/dev/null | openssl x509 -noout -dates   # → notBefore=… / notAfter=… (만료일)
$ openssl req -x509 -newkey rsa:2048 -nodes -keyout key.pem -out cert.pem -days 365 -subj '/CN=localhost'   # → key.pem, cert.pem 생성
$ openssl rand -base64 24   # → 32글자 무작위 문자열
@ ssh-keygen [옵션] :: SSH 키 생성 · 관리
- -t ed25519 :: 키 종류 (ed25519 권장, rsa -b 4096)
- -C '<설명>' :: 주석 (보통 이메일)
- -f <파일> :: 저장 경로
- -p :: 암호 변경
- -R <호스트> :: known_hosts 에서 호스트 제거
- -lf <키.pub> :: 지문 확인
$ ssh-keygen -t ed25519 -C 'kim@laptop'   # → ~/.ssh/id_ed25519(.pub) 생성
$ ssh-keygen -R 192.168.0.10          # 호스트 키 바뀜 경고 해결
@ ssh-copy-id [-i 키] <사용자@호스트> :: 공개키를 서버 authorized_keys 에 등록
$ ssh-copy-id -i ~/.ssh/id_ed25519.pub kim@server   # → Number of key(s) added: 1
@ ssh-agent / ssh-add :: 개인키 암호를 메모리에 기억
- ssh-add [키] :: 키 추가
- ssh-add -l / -D :: 목록 / 모두 제거
- ssh-add -t 1h :: 유효 시간
$ eval "$(ssh-agent -s)" && ssh-add ~/.ssh/id_ed25519   # → Agent pid 1234 / Identity added: …

# 권한 · 사용자 · 그룹 | sys
@ chmod [옵션] <모드> <파일…> :: 권한 변경
~ 소유자(u) · 그룹(g) · 기타(o) 각각 읽기 r=4, 쓰기 w=2, 실행 x=1 을 더한 값.
- -R :: 하위까지 재귀
- u g o a :: 대상: 소유자 / 그룹 / 기타 / 모두
- + - = :: 추가 / 제거 / 정확히 지정
- X :: 디렉토리와 이미 실행 가능한 파일에만 x
- 755 :: rwxr-xr-x — 실행 파일, 디렉토리
- 644 :: rw-r--r-- — 일반 파일
- 600 :: rw------- — 비밀키, 비밀 설정
- 700 :: rwx------ — 개인 디렉토리 (~/.ssh)
$ chmod +x deploy.sh   # → ./deploy.sh 로 실행 가능
$ chmod 600 ~/.ssh/id_ed25519   # → -rw------- (본인만 읽기·쓰기)
$ chmod -R u+rwX,go-w project/   # → 디렉토리는 들어갈 수 있고 쓰기는 본인만
$ find . -type d -exec chmod 755 {} +   # → 모든 디렉토리 drwxr-xr-x
> 디렉토리에서 x 는 "들어갈 수 있음", r 은 "목록을 볼 수 있음"

@ chown [옵션] <소유자>[:<그룹>] <파일…> :: 소유자 · 그룹 변경
~ 보통 root 권한이 필요하다. 그룹만 바꿀 땐 :그룹 형태로 쓴다.
- -R :: 재귀
- -h :: 링크 대상이 아닌 링크 자체
- --reference=<파일> :: 그 파일과 같은 소유로
- -v / -c :: 처리 출력 / 바뀐 것만 출력
$ sudo chown kim file.txt   # → 소유자가 kim 으로
$ sudo chown -R www-data:www-data /var/www/html   # → 웹 서버 계정 소유로 변경
$ sudo chown :dev shared.log   # → 그룹만 dev 로
$ sudo chown -R "$USER": ~/.npm   # 권한 꼬인 캐시 복구

@ chgrp [-R] <그룹> <파일…> :: 그룹만 변경
$ sudo chgrp -R developers /srv/project   # → 그룹이 developers 로
@ umask [모드] :: 새 파일의 기본 권한 마스크
~ 새 파일 666, 디렉토리 777 에서 마스크를 뺀 값. 022 → 파일 644 · 디렉토리 755.
- -S :: 기호로 보기 (u=rwx,g=rx,o=rx)
$ umask 027                           # 그룹 읽기만, 기타 없음
@ getfacl / setfacl :: ACL — 사용자별 세부 권한
- setfacl -m u:<사용자>:rwx :: 사용자 권한 추가
- setfacl -m g:<그룹>:rx :: 그룹 권한 추가
- setfacl -d -m … :: 새로 생길 파일의 기본 ACL
- setfacl -x u:<사용자> / -b :: 하나 제거 / 전부 제거
$ setfacl -m u:alice:rw report.xlsx   # → alice 에게 읽기·쓰기 허용
$ getfacl report.xlsx   # → user::rw- user:alice:rw- group::r-- …
@ sudo [옵션] <명령> :: 관리자(다른 사용자) 권한으로 실행
~ sudoers 에 허용된 사용자만 쓸 수 있다. 내 비밀번호로 인증하고 잠시 기억한다.
- -u <사용자> :: 그 사용자로 실행
- -i :: root 로그인 셸 (환경 초기화)
- -s :: 현재 환경을 유지한 root 셸
- -E :: 현재 환경 변수 유지
- -l :: 내가 쓸 수 있는 명령 목록
- -k :: 인증 기억 즉시 해제
$ sudo apt update   # → Hit:1 … Reading package lists… Done
$ sudo -u postgres psql   # → postgres=# 프롬프트
$ sudo !!                          # 직전 명령을 sudo 로 재실행
$ echo '10.0.0.5 db' | sudo tee -a /etc/hosts   # → /etc/hosts 에 한 줄 추가
$ sudo visudo                      # sudoers 안전 편집
> sudo echo x > /etc/f 는 실패한다: > 는 내 셸이 처리하므로 tee 를 쓴다

@ visudo [-f 파일] :: sudoers 문법 검사하며 안전하게 편집
: kim ALL=(ALL) NOPASSWD: /usr/bin/systemctl restart app
$ sudo visudo -f /etc/sudoers.d/deploy   # → 저장 시 문법 검사, 틀리면 다시 편집
@ su [옵션] [사용자] :: 다른 사용자로 전환
- - / -l :: 그 사용자의 로그인 환경으로
- -c '<명령>' :: 명령만 실행
- -s <셸> :: 셸 지정
$ su - postgres   # → postgres@host:~$ 프롬프트
$ sudo su -                           # root 로그인 셸
@ id [사용자] :: UID · GID · 소속 그룹
$ id kim                              # uid=1000(kim) gid=1000(kim) groups=…
@ whoami :: 현재 사용자 이름
@ groups [사용자] :: 소속 그룹 목록
@ who :: 로그인한 사용자 목록 (-b 마지막 부팅)
@ w :: 로그인 사용자 + 하는 일 + 부하
@ last [옵션] :: 로그인 · 재부팅 이력
- -n N / reboot :: 최근 N개 / 재부팅 기록
$ last -n 10   # → kim pts/0 10.0.0.2 Mon Nov 2 09:01 still logged in
$ lastb | head                        # 실패한 로그인 (sudo)
@ useradd [옵션] <사용자> :: 사용자 계정 생성
- -m :: 홈 디렉토리 생성
- -s <셸> :: 로그인 셸 (/bin/bash)
- -G <그룹,…> :: 보조 그룹
- -u <UID> / -d <홈> :: UID / 홈 경로
- -r :: 시스템 계정 (서비스용)
$ sudo useradd -m -s /bin/bash -G sudo,docker dev   # → dev 계정 생성 (홈·bash·그룹)
$ sudo useradd -r -s /usr/sbin/nologin appsvc   # → 로그인 불가 서비스 계정
> Debian 계열의 adduser 는 대화형으로 더 편하다
@ usermod [옵션] <사용자> :: 계정 정보 변경
- -aG <그룹> :: 그룹 추가 (-a 빠지면 기존 그룹 사라짐!)
- -s <셸> :: 셸 변경
- -L / -U :: 잠금 / 해제
- -l <새이름> :: 이름 변경
$ sudo usermod -aG docker $USER      # 다시 로그인해야 적용
@ userdel [-r] <사용자> :: 계정 삭제 (-r 홈·메일까지)
@ groupadd <그룹> :: 그룹 생성 (groupdel 삭제)
@ passwd [옵션] [사용자] :: 비밀번호 변경
- -l / -u :: 잠금 / 해제
- -e :: 다음 로그인 때 변경 강제
- -S :: 상태
$ passwd   # → 현재 암호 → 새 암호 두 번 입력
$ sudo passwd -e newuser   # → 다음 로그인 때 암호 변경 요구
@ chage [옵션] <사용자> :: 비밀번호 만료 정책
- -l :: 현재 정책 보기
- -M N :: 최대 사용 일수
$ sudo chage -l kim   # → Last password change: … Password expires: never
@ newgrp <그룹> :: 다시 로그인하지 않고 새 그룹 적용한 셸
$ newgrp docker   # → docker 그룹이 적용된 새 셸

# 디스크 · 파일시스템 | sys
@ du [옵션] [경로…] :: 디렉토리 · 파일이 차지하는 용량
- -h :: 사람이 읽기 쉬운 단위
- -s :: 각 인자의 합계만
- -d N :: N단계 깊이까지 (--max-depth)
- -c :: 마지막에 총합
- -a :: 파일까지 모두
- --exclude=<패턴> :: 제외
- -x :: 다른 파일시스템은 건너뜀
$ du -sh ~/Downloads   # → 3.2G	/home/kim/Downloads
$ du -sh * | sort -rh | head -10        # 큰 항목 Top 10
$ sudo du -xh / -d1 2>/dev/null | sort -rh | head   # → 12G /var  8G /usr … 큰 순서
> 대화형으로 보려면 ncdu

@ df [옵션] [경로] :: 파일시스템(디스크) 여유 공간
- -h :: 사람 단위
- -T :: 파일시스템 종류 표시
- -i :: inode 사용량 (작은 파일이 아주 많을 때)
- -x <종류> :: 그 종류 제외 (tmpfs)
$ df -h   # → Filesystem Size Used Avail Use% Mounted on
$ df -h /home                   # 그 경로가 있는 디스크
$ df -hT -x tmpfs -x devtmpfs   # → 실제 디스크만 형식과 함께
> df 와 du 결과가 크게 다르면: 지워졌지만 열려 있는 파일 → lsof +L1

@ ncdu [경로] :: 대화형 디스크 사용량 분석
~ 방향키로 들어가며 큰 디렉토리를 찾고 d 로 삭제할 수 있다.
- -x :: 같은 파일시스템만
$ sudo ncdu -x /   # → 대화형 화면에서 큰 폴더 탐색
@ lsblk [옵션] :: 블록 장치(디스크·파티션) 트리
- -f :: 파일시스템 · UUID · 마운트 위치
- -o <열> :: 열 선택 (NAME,SIZE,TYPE,MOUNTPOINTS)
- -d :: 디스크만
$ lsblk -f   # → sda ├─sda1 vfat … └─sda2 ext4 <UUID> /
@ blkid [장치] :: 파티션 UUID · 형식 (fstab 작성용)
$ sudo blkid /dev/sdb1   # → /dev/sdb1: UUID="…" TYPE="ext4"
@ mount [옵션] <장치> <마운트지점> :: 파일시스템 연결
- -t <형식> :: ext4 vfat ntfs nfs …
- -o <옵션> :: ro, rw, remount, loop, uid=…
- -a :: fstab 의 모든 항목
$ sudo mount /dev/sdb1 /mnt/usb   # → /mnt/usb 에서 USB 내용 보임
$ sudo mount -o loop disk.iso /mnt/iso   # → ISO 내용이 /mnt/iso 에
$ sudo mount -o remount,rw /   # → 읽기 전용 / 를 쓰기 가능으로
: UUID=xxxx  /data  ext4  defaults,noatime  0  2   # /etc/fstab
@ umount [옵션] <지점|장치> :: 마운트 해제
- -l :: 지연 해제 (사용 중일 때)
$ sudo umount /mnt/usb   # → 출력 없음 (해제 완료)
> "target is busy" 면 lsof +D /mnt/usb 로 사용 중인 프로세스 확인
@ findmnt [옵션] [경로] :: 마운트 트리 · 경로가 속한 마운트
$ findmnt -T /var/lib/docker   # → TARGET / SOURCE /dev/sda2 FSTYPE ext4
$ findmnt -t ext4,xfs   # → ext4·xfs 마운트만 트리로
@ fdisk [옵션] <디스크> :: 파티션 편집 (MBR · GPT)
- -l :: 모든 디스크 · 파티션 목록
- 대화형 n d p w q :: 새로 / 삭제 / 보기 / 저장 / 저장 없이 종료
$ sudo fdisk -l   # → Disk /dev/sda: 476.94 GiB … 파티션 목록
$ sudo fdisk /dev/sdb   # → Command (m for help): 대화형 편집
@ parted [장치] [명령] :: 파티션 편집 (큰 디스크 · GPT)
$ sudo parted /dev/sdb mklabel gpt mkpart primary ext4 0% 100%   # → 디스크 전체를 GPT 파티션 하나로
@ mkfs.<형식> [옵션] <장치> :: 파일시스템 생성 (포맷)
- mkfs.ext4 -L <라벨> :: ext4
- mkfs.xfs / mkfs.vfat -F 32 :: XFS / FAT32
$ sudo mkfs.ext4 -L data /dev/sdb1   # → ext4 생성, 라벨 data
> 장치 이름을 lsblk 로 꼭 두 번 확인
@ fsck [옵션] <장치> :: 파일시스템 검사 · 복구 (마운트 해제 후)
- -y :: 모든 수정에 yes
$ sudo umount /dev/sdb1 && sudo fsck -y /dev/sdb1   # → 오류를 자동 수정하며 검사
@ resize2fs <장치> [크기] :: ext4 크기 조정 (파티션 늘린 뒤)
$ sudo resize2fs /dev/sda2   # → 파티션 크기만큼 파일시스템 확장
@ dd if=<입력> of=<출력> [옵션] :: 블록 단위 복사 · 이미지 굽기
- bs=4M :: 블록 크기
- count=N :: N블록만
- status=progress :: 진행률
- conv=fsync :: 끝에 디스크에 확실히 기록
$ sudo dd if=ubuntu.iso of=/dev/sdX bs=4M status=progress conv=fsync   # → 1073741824 bytes … copied, 32 s, 33 MB/s
$ dd if=/dev/zero of=test.img bs=1M count=1024   # → 1GB 0 으로 채운 파일
> of= 를 잘못 쓰면 디스크가 통째로 지워진다
@ sync :: 메모리 버퍼를 디스크에 기록 (USB 빼기 전)
@ mkswap / swapon / swapoff :: 스왑 만들기 · 켜기 · 끄기
$ sudo fallocate -l 4G /swapfile && sudo chmod 600 /swapfile   # → 4GB 스왑 파일 (600 권한)
$ sudo mkswap /swapfile && sudo swapon /swapfile   # → 스왑 활성화
$ swapon --show   # → NAME TYPE SIZE USED PRIO /swapfile file 4G 0B -2

# 프로세스 · 작업 | sys
@ ps [옵션] :: 실행 중인 프로세스 스냅샷
~ BSD 스타일(aux, - 없음)과 System V 스타일(-ef)이 모두 쓰인다.
- aux :: 모든 프로세스, %CPU %MEM 표시
- -ef :: 전체 목록, PPID(부모) 포함
- -u <사용자> :: 사용자별
- -p <PID> :: 특정 PID
- -o <열> :: 출력 열 (pid,ppid,user,%cpu,%mem,etime,cmd)
- --sort=-%cpu :: 정렬 (- 는 내림차순)
- --forest :: 부모-자식 트리
$ ps aux | grep '[n]ginx'          # [n] 으로 grep 자신 제외
$ ps -ef --forest | less   # → 부모-자식 관계가 \_ 로 표시
$ ps -eo pid,user,%cpu,%mem,etime,cmd --sort=-%mem | head   # → 메모리 많이 쓰는 순 PID·사용자·시간
> STAT: R 실행 · S 대기 · D I/O 대기 · Z 좀비 · T 정지 / RSS 는 실제 메모리(KB)

@ top [옵션] :: 실시간 프로세스 · 자원 모니터
~ 위는 부하 평균 · CPU · 메모리, 아래는 프로세스 목록. 더 편한 htop 도 많이 쓴다.
- -d 초 :: 갱신 간격
- -p PID :: 특정 프로세스만
- -u <사용자> :: 사용자 필터
- -b -n 1 :: 한 번만 출력 (파일 저장용)
- P / M / T :: CPU / 메모리 / 시간 정렬
- 1 :: CPU 코어별 표시
- c :: 전체 명령줄 보기
- k :: 프로세스 종료 (PID 입력)
- H :: 스레드 보기
- q :: 종료
$ top -o %MEM   # → 메모리 순으로 정렬된 top
$ top -b -n 1 | head -20 > snapshot.txt   # → 현재 상태 20줄을 파일로 저장
$ htop -u www-data   # → www-data 프로세스만
> load average 세 값은 1 · 5 · 15분 평균. 코어 수(nproc)보다 크면 밀리는 중

@ htop [옵션] :: 컬러 · 마우스 지원 프로세스 모니터
- F3 / F4 :: 검색 / 필터
- F5 :: 트리 보기
- F6 :: 정렬 기준
- F9 / F7 F8 :: 종료 신호 / 우선순위
- Space :: 여러 개 선택
- -u <사용자> / -p <PID> :: 필터
$ htop -u www-data   # → www-data 프로세스만
@ pstree [옵션] [PID] :: 프로세스 부모-자식 트리
- -p :: PID 표시
- -a :: 명령 인자 표시
$ pstree -pa $(pgrep -o sshd)   # → sshd(812)───sshd(2041)───bash(2050)
@ pgrep [옵션] <패턴> :: 이름으로 PID 찾기
- -f :: 전체 명령줄에서 찾기
- -a / -l :: 명령줄 / 이름 함께
- -u <사용자> :: 사용자
- -o / -n :: 가장 오래된 / 최신 하나
$ pgrep -af 'node.*server'   # → 31337 node /app/server.js
@ pidof <프로그램> :: 실행 중인 프로그램의 PID
$ pidof nginx   # → 1301 1300 (여러 PID)
@ kill [-신호] <PID…> :: 프로세스에 신호 보내기
~ 기본은 TERM(15) 정상 종료 요청. 응답이 없을 때만 KILL(9) 을 쓴다.
- -15 / -TERM :: 정상 종료 요청 (정리 작업 가능)
- -9 / -KILL :: 즉시 강제 종료 (정리 불가)
- -1 / -HUP :: 설정 다시 읽기 (데몬)
- -2 / -INT :: Ctrl+C 와 같음
- -STOP / -CONT :: 일시정지 / 재개
- -0 :: 신호 없이 살아 있는지만 확인
- pkill <이름> :: 이름으로 종료 (-f 전체 명령줄)
- killall <이름> :: 같은 이름 전부 종료
- pgrep -a <이름> :: 이름으로 PID 찾기
$ kill 1234   # → 정상 종료 요청 (출력 없음)
$ kill -9 1234   # → 즉시 강제 종료
$ pkill -f 'python manage.py runserver'   # → runserver 프로세스 종료
$ kill -HUP $(pgrep -o nginx)   # → nginx 가 설정을 다시 읽음
$ kill -0 1234 && echo '살아있음'   # → 살아있음 (있을 때만 출력)

@ pkill [옵션] <패턴> :: 이름으로 신호 보내기
- -f :: 전체 명령줄 매칭
- -u <사용자> :: 사용자
- -9 / -HUP :: 신호
$ pkill -f 'gunicorn app:app'   # → gunicorn 프로세스 종료
@ killall [옵션] <이름> :: 이름이 같은 프로세스 모두 종료
- -9 / -i :: 강제 / 확인
$ killall -HUP nginx   # → 모든 nginx 에 HUP 전송
@ jobs [-l] :: 현재 셸의 백그라운드 · 정지 작업
$ sleep 100 &  jobs -l   # → [1]+ 4321 Running  sleep 100 &
@ bg [%N] :: 정지된 작업을 백그라운드에서 계속
> Ctrl+Z 로 멈춘 뒤 bg 하면 터미널을 계속 쓸 수 있다
@ fg [%N] :: 작업을 포그라운드로
$ fg %1   # → 1번 작업이 앞으로 (입력 대기)
@ nohup <명령> & :: 로그아웃해도 계속 실행
$ nohup ./server > server.log 2>&1 &   # → [1] 4567 — 로그아웃해도 계속 실행
@ disown [-h] [%N] :: 실행 중 작업을 셸에서 분리
$ disown -h %1   # → 셸을 닫아도 작업 유지
@ nice [-n N] <명령> :: 낮은(또는 높은) 우선순위로 실행
~ -20 가장 높음 ~ 19 가장 낮음. 음수는 root 만.
$ nice -n 19 tar czf backup.tgz /data   # → 다른 작업을 방해하지 않고 압축
@ renice <우선순위> -p <PID> :: 실행 중인 프로세스 우선순위 변경
$ sudo renice -n -5 -p 1234   # → 1234 (process ID) old priority 0, new priority -5
@ timeout [옵션] <시간> <명령> :: 시간 제한 실행
- -s <신호> :: 보낼 신호 (기본 TERM)
- -k <시간> :: 그래도 안 끝나면 KILL
$ timeout 30s ./slow-test.sh || echo '시간 초과'   # → 30초 넘으면 '시간 초과'
@ watch [옵션] <명령> :: 명령을 주기적으로 다시 실행
- -n 초 :: 간격 (기본 2초)
- -d :: 바뀐 부분 강조
- -t :: 머리글 숨김
$ watch -n 1 -d 'ss -tn state established | wc -l'   # → 1초마다 연결 수, 바뀐 숫자 강조
$ watch -d df -h   # → 2초마다 디스크 사용량 갱신
@ fuser [옵션] <파일|포트> :: 파일 · 포트를 쓰는 프로세스
- -v :: 상세
- -k :: 해당 프로세스 종료
- -m <마운트> :: 그 파일시스템 사용 중인 것
$ sudo fuser -v 8080/tcp   # → USER PID ACCESS COMMAND 8080/tcp: kim 4321 F.... node
$ sudo fuser -km /mnt/usb   # → USB 를 쓰는 프로세스 종료 (umount 가능)
@ time <명령> :: 실행 시간 측정 (real · user · sys)
$ time ./build.sh   # → real 0m12.3s user 0m9.8s sys 0m1.1s
$ /usr/bin/time -v ./app             # 최대 메모리 등 상세
@ lsof [옵션] :: 열린 파일 · 포트를 쓰는 프로세스
~ 리눅스에서는 소켓도 파일이라 "이 포트 누가 쓰지?"를 알아낼 때 가장 많이 쓴다.
- -i :포트 :: 그 포트를 쓰는 프로세스
- -iTCP -sTCP:LISTEN :: 대기 중인 TCP 포트
- -p <PID> :: 그 프로세스가 연 파일
- -u <사용자> :: 사용자별
- +D <디렉토리> :: 그 안의 열린 파일 (umount 안 될 때)
- -n / -P :: 이름 · 포트 이름 해석 안 함 (빠름)
- -t :: PID 만 출력
- +L1 :: 지워졌지만 아직 열린 파일
$ sudo lsof -i :3000   # → node 4321 kim … TCP *:3000 (LISTEN)
$ sudo lsof -iTCP -sTCP:LISTEN -nP   # → LISTEN 중인 포트와 프로세스
$ kill $(lsof -t -i :8080)   # → 8080 을 쓰는 프로세스 종료
$ sudo lsof +L1 | grep deleted   # → 지워졌지만 공간을 차지 중인 파일

- -a :: 전부
- -r / -m :: 커널 버전 / 아키텍처
$ uname -r                            # 6.8.0-45-generic

- -I :: 모든 IP 주소
@ hostnamectl :: 호스트 이름 · OS · 커널 요약 (set-hostname 으로 변경)
$ sudo hostnamectl set-hostname web-01   # → 호스트 이름이 web-01 로
@ lsb_release -a :: 배포판 이름 · 버전 (또는 cat /etc/os-release)
$ . /etc/os-release && echo "$PRETTY_NAME"   # → Ubuntu 24.04.1 LTS

$ make -j"$(nproc)"   # → 코어 수만큼 병렬 빌드

- -k :: 사용 중인 드라이버
$ lspci -k | grep -A3 -i vga   # → VGA … NVIDIA … Kernel driver in use: nvidia
@ lsusb [-t] :: USB 장치 (-t 트리)
@ lshw [옵션] :: 하드웨어 전체 정보
- -short :: 요약
- -C <종류> :: network, disk, memory …
$ sudo lshw -short   # → H/W path Device Class Description 요약표
@ dmidecode [-t 종류] :: BIOS · 메인보드 · 메모리 슬롯 정보
$ sudo dmidecode -t memory | grep -i size   # → Size: 16 GB / No Module Installed
@ dmesg [옵션] :: 커널 메시지 (장치 인식 · 드라이버 오류)
- -T :: 사람이 읽는 시각
- -w :: 실시간 추적
- -l err,warn :: 레벨 필터
$ sudo dmesg -T | tail -30   # → [Mon Nov 2 09:12] usb 1-2: new device …
$ sudo dmesg -w                       # USB 꽂으며 확인
@ vmstat [간격] [횟수] :: CPU · 메모리 · 스왑 · I/O 요약 통계

- -x :: 확장 통계 (%util, await)
- -z :: 활동 없는 장치 숨김
$ iostat -xz 1   # → 장치별 r/s w/s await %util 1초마다
@ mpstat [-P ALL] [간격] :: CPU 코어별 사용률
$ mpstat -P ALL 1   # → CPU 0, 1, 2 … 코어별 %usr %sys %idle
@ iotop [옵션] :: 프로세스별 디스크 I/O (sudo)
- -o :: 실제 I/O 중인 것만
$ sudo iotop -o   # → 지금 디스크를 읽고 쓰는 프로세스
@ sar [옵션] [간격] [횟수] :: 시스템 활동 기록 · 조회
- -u / -r / -n DEV :: CPU / 메모리 / 네트워크
$ sar -u 1 5   # → %user %system %iowait %idle 5회
@ date [옵션] [+형식] :: 날짜 · 시각 출력 · 계산
- +%F / +%T :: 2026-11-02 / 14:05:09
- +%s :: 유닉스 시간 (초)
- -d '<표현>' :: 지정 시각 ("yesterday", "+3 days")
- -u :: UTC
$ date '+%Y-%m-%d %H:%M:%S'   # → 2026-11-02 14:05:09
$ date -d @1700000000   # → Tue Nov 14 22:13:20 UTC 2023
$ date -d 'next friday' +%F   # → 2026-11-06
$ cp db.sql "db-$(date +%F).sql"   # → db-2026-11-02.sql 로 복사
@ timedatectl [명령] :: 시간대 · NTP 동기화
$ timedatectl   # → Local time … Time zone: Asia/Seoul … NTP: active
$ sudo timedatectl set-timezone Asia/Seoul   # → 시간대가 Asia/Seoul 로
@ cal [옵션] :: 달력 (-3 앞뒤 달, -y 연간)
@ sysctl [옵션] [키[=값]] :: 커널 매개변수 보기 · 변경

- -w :: 변경 (재부팅 시 원복)
- -p :: /etc/sysctl.conf 다시 적용
$ sysctl vm.swappiness   # → vm.swappiness = 60

- -r :: 제거
$ sudo modprobe br_netfilter   # → 모듈 로드 (출력 없음)



# 시스템 고급 · 저장장치 | sys
@ getent <DB> [키] :: 사용자 · 그룹 · 호스트 DB 조회 (LDAP 등 포함)
- passwd / group / hosts :: 조회할 DB
$ getent passwd kim   # → kim:x:1000:1000:Kim:/home/kim:/bin/bash
$ getent hosts example.com   # → 93.184.215.14  example.com
@ systemd-run [옵션] <명령> :: 명령을 임시 systemd 유닛으로 실행
- --user / --scope :: 사용자 유닛 / 현재 터미널에 붙여서
- -p MemoryMax=1G :: 자원 제한
$ systemd-run --user --scope -p MemoryMax=2G ./heavy-job   # → 2GB 넘으면 그 작업만 종료됨
@ chroot <새루트> [명령] :: 루트 디렉토리를 바꿔 실행 (복구 작업)
$ sudo chroot /mnt/sysroot /bin/bash   # → 복구 대상 시스템 안의 root 셸
@ nsenter [옵션] :: 다른 프로세스(컨테이너)의 네임스페이스로 진입
- -t <PID> -n :: 그 PID 의 네트워크 네임스페이스
$ sudo nsenter -t "$(docker inspect -f '{{.State.Pid}}' web)" -n ss -tlnp   # → 컨테이너 안의 LISTEN 포트
@ smartctl [옵션] <디스크> :: 디스크 S.M.A.R.T. 건강 상태
- -H / -a :: 요약 판정 / 전체 정보
- -t short :: 짧은 자가 진단
$ sudo smartctl -H /dev/nvme0n1   # → SMART overall-health … PASSED
@ lvs / vgs / pvs :: LVM 논리 볼륨 · 볼륨 그룹 · 물리 볼륨
- lvextend -r -L +10G <LV> :: 늘리면서 파일시스템도 확장
$ sudo lvs   # → LV VG Attr LSize … ubuntu-lv ubuntu-vg 100.00g
$ sudo lvextend -r -L +20G /dev/ubuntu-vg/ubuntu-lv   # → LV 와 파일시스템이 20GB 늘어남

- luksFormat <장치> :: 암호화 초기화
- open <장치> <이름> / close <이름> :: 열기 / 닫기
$ sudo cryptsetup open /dev/sdb1 secure && sudo mount /dev/mapper/secure /mnt   # → 암호 입력 후 /mnt 에 마운트

# 서비스 · 부팅 · 로그 · 예약 | sys
@ systemctl <동작> [유닛] :: systemd 서비스 관리
~ 서비스는 유닛(nginx.service) 단위로 관리한다. .service 는 생략할 수 있다.
- start / stop :: 시작 / 정지
- restart :: 재시작
- reload :: 프로세스는 두고 설정만 다시 읽기
- status :: 상태 · PID · 최근 로그
- enable / disable :: 부팅 시 자동 시작 켜기 / 끄기
- enable --now :: 자동 시작 등록 + 지금 시작
- is-active / is-enabled :: 상태 확인 (스크립트용)
- list-units --type=service :: 로드된 서비스 목록
- --failed :: 실패한 유닛
- daemon-reload :: 유닛 파일을 고친 뒤 반드시 실행
- cat / edit <유닛> :: 유닛 파일 보기 / override 편집
- mask / unmask :: 시작 자체를 금지 / 해제
- --user :: 로그인 사용자의 서비스
$ sudo systemctl restart nginx   # → 출력 없음 (재시작 완료)
$ systemctl status sshd   # → ● ssh.service … Active: active (running)
$ sudo systemctl enable --now docker   # → Created symlink … 지금 시작됨
$ systemctl --failed   # → 0 loaded units listed. (없을 때)
$ sudo systemctl daemon-reload && sudo systemctl restart myapp   # → 바뀐 유닛 파일로 재시작

@ journalctl [옵션] :: systemd 로그 조회
- -u <유닛> :: 특정 서비스 로그
- -f :: 실시간 추적
- -n N :: 마지막 N줄
- -e :: 끝으로 바로 이동
- -r :: 최신 먼저
- -b / -b -1 :: 이번 부팅 / 이전 부팅
- --since / --until :: "2026-11-01 09:00", "1 hour ago", today
- -p <레벨> :: err, warning 이상만
- -k :: 커널 메시지 (dmesg)
- -g <패턴> :: 메시지 검색
- -o cat / json-pretty :: 출력 형식
- --vacuum-time=2w :: 오래된 로그 정리
$ journalctl -u nginx -f   # → nginx 로그가 실시간으로
$ journalctl -u myapp --since '10 min ago'   # → 최근 10분 로그
$ journalctl -p err -b   # → 이번 부팅 이후 에러만
$ journalctl -u ssh -g 'Failed password' --since today   # → 오늘 로그인 실패 기록

@ systemd-analyze [명령] :: 부팅 시간 분석
- blame :: 유닛별 소요 시간
- critical-chain :: 가장 오래 걸린 경로
$ systemd-analyze blame | head   # → 12.3s plymouth-quit-wait.service … 느린 순
@ shutdown [옵션] [시각] :: 종료 · 재부팅 예약
- -h now :: 즉시 종료
- -r +10 :: 10분 후 재부팅
- -c :: 예약 취소
$ sudo shutdown -r +5 '점검으로 5분 후 재부팅'   # → 접속자에게 공지, 5분 뒤 재부팅
@ reboot / poweroff :: 즉시 재부팅 / 전원 끄기
@ loginctl [명령] :: 로그인 세션 관리
- list-sessions :: 세션 목록
- enable-linger <사용자> :: 로그아웃해도 사용자 서비스 유지
$ sudo loginctl enable-linger deploy   # → 로그아웃 후에도 deploy 서비스 유지
@ logger [옵션] <메시지> :: 시스템 로그에 메시지 남기기
- -t <태그> / -p <우선순위> :: 태그 / user.err 등
$ logger -t backup '백업 완료'   # → journalctl -t backup 에서 확인 가능
@ logrotate [옵션] <설정> :: 로그 회전 · 압축 · 삭제
- -d :: 테스트 (실행 안 함)
- -f :: 강제 회전
: /var/log/app/*.log {
:   daily
:   rotate 14
:   compress
:   missingok
:   copytruncate
: }
$ sudo logrotate -d /etc/logrotate.d/app   # → 실제 변경 없이 동작만 출력
@ crontab [옵션] :: 주기적으로 실행할 작업 등록
~ 형식은 "분 시 일 월 요일 명령". 환경 변수가 거의 없으니 절대 경로를 쓴다.
- -e :: 내 crontab 편집
- -l :: 목록 보기
- -r :: 전부 삭제 (주의)
- -u <사용자> :: 다른 사용자 것 (root)
- 분 시 일 월 요일 :: 0-59 · 0-23 · 1-31 · 1-12 · 0-7 (0과 7=일)
- * / , / - / */N :: 매번 / 여러 값 / 범위 / N마다
- @reboot @daily @hourly :: 부팅 시 / 매일 0시 / 매시 정각
: */5 * * * *  /opt/bin/healthcheck.sh             # 5분마다
: 0 3 * * *    /opt/bin/backup.sh >> /var/log/backup.log 2>&1
: 0 9 * * 1-5  /opt/bin/report.sh                 # 평일 09:00
: 0 0 1 * *    /opt/bin/monthly.sh                # 매월 1일 자정
> 출력은 로그 파일로 남겨야 실패 원인을 알 수 있다

@ at <시각> :: 한 번만 예약 실행
- atq / atrm <번호> :: 대기 목록 / 취소
$ echo '/opt/bin/report.sh' | at 23:30   # → job 3 at Mon Nov 2 23:30:00 2026
$ at now + 2 hours < job.sh   # → 2시간 뒤 실행 예약

# 패키지 관리 | sys
@ apt <동작> [패키지…] :: Debian · Ubuntu 패키지 관리
- update :: 저장소 패키지 목록 갱신 (설치 전에 먼저)
- upgrade :: 설치된 패키지 업그레이드
- install <pkg> :: 설치 (-y 확인 생략)
- install ./file.deb :: 로컬 .deb 설치
- remove / purge :: 제거 / 설정 파일까지 제거
- autoremove :: 필요 없어진 의존성 제거
- search <단어> :: 검색
- show <pkg> :: 버전 · 설명 · 의존성
- list --installed / --upgradable :: 설치된 / 업그레이드 가능 목록
$ sudo apt update && sudo apt upgrade -y   # → 목록 갱신 후 모든 패키지 업그레이드
$ sudo apt install -y git curl build-essential   # → 설치 완료 (확인 질문 없음)
$ apt search ripgrep   # → ripgrep/noble 14.1.0 amd64 …
$ sudo apt purge apache2 && sudo apt autoremove   # → 설정까지 제거 후 남은 의존성 정리
> Fedora · RHEL 은 dnf install, Arch 는 pacman -S, macOS 는 brew install

@ dpkg [옵션] :: .deb 패키지 저수준 관리
- -i <파일.deb> :: 설치
- -l [패턴] :: 설치된 목록
- -L <패키지> :: 설치된 파일 목록
- -S <경로> :: 그 파일을 설치한 패키지
- -r / -P :: 제거 / 설정까지 제거
$ sudo dpkg -i chrome.deb || sudo apt -f install   # → 의존성 오류가 나면 자동 해결
$ dpkg -S /usr/bin/dig   # → dnsutils: /usr/bin/dig
@ dnf <명령> [패키지] :: Fedora · RHEL · Rocky 패키지 관리
- install / remove / upgrade :: 설치 / 제거 / 업그레이드
- search / info :: 검색 / 정보
- provides <경로> :: 그 파일을 제공하는 패키지
- history / history undo N :: 기록 / 되돌리기
$ sudo dnf install -y git gcc   # → 확인 없이 설치
$ dnf provides '*/bin/dig'   # → bind-utils-9.18… : DNS utilities
@ rpm [옵션] :: .rpm 패키지 저수준 관리
- -qa / -qi <pkg> :: 설치 목록 / 정보
- -ql <pkg> / -qf <경로> :: 파일 목록 / 소유 패키지
- -ivh / -Uvh :: 설치 / 업그레이드
$ rpm -qa | grep kernel   # → kernel-6.11.4-… 설치된 커널 목록
@ pacman <옵션> :: Arch · Manjaro 패키지 관리
- -Syu :: 전체 업그레이드
- -S <pkg> :: 설치
- -Rns <pkg> :: 의존성 · 설정까지 제거
- -Ss / -Qs :: 저장소 검색 / 설치된 것 검색
- -Qo <경로> :: 소유 패키지
$ sudo pacman -Syu   # → 동기화 후 전체 업그레이드
@ zypper <명령> :: openSUSE 패키지 관리 (in, rm, up, se)
@ snap <명령> :: Snap 패키지 (Ubuntu)
- install <pkg> [--classic] :: 설치
- list / refresh / remove :: 목록 / 업데이트 / 제거
$ sudo snap install code --classic   # → code 1.9x from Microsoft installed
@ flatpak <명령> :: Flatpak 앱 관리
- install flathub <앱ID> :: 설치
- list / update / uninstall :: 목록 / 업데이트 / 제거
- run <앱ID> :: 실행
$ flatpak install flathub org.gimp.GIMP   # → GIMP 설치 (flatpak run org.gimp.GIMP 로 실행)
$ flatpak uninstall --unused   # → 안 쓰는 런타임 제거

# 네트워크 · 원격 | net
@ ping [옵션] <호스트> :: 연결 · 응답 시간 확인 (ICMP)
- -c N :: N번만 보내고 종료
- -i 초 :: 보내는 간격
- -W 초 :: 응답 대기 시간
- -4 / -6 :: IPv4 / IPv6
$ ping -c 4 google.com   # → 64 bytes from …: time=31.2 ms … 0% packet loss
$ ping -c 1 -W 1 10.0.0.5 > /dev/null && echo up   # → up (응답 있을 때만)
> 응답이 없다고 서버가 꺼진 건 아니다. 방화벽이 ICMP 를 막을 수 있으니 포트는 nc -zv 로

@ ip <객체> <명령> :: IP 주소 · 라우팅 · 인터페이스 (ifconfig 대체)
- ip a :: 인터페이스별 IP 주소
- ip -br a :: 한 줄 요약
- ip link :: 인터페이스 상태 · MAC 주소
- ip link set eth0 up / down :: 켜기 / 끄기
- ip r :: 라우팅 테이블 · 기본 게이트웨이
- ip route get <IP> :: 그 주소로 가는 실제 경로
- ip addr add 192.168.1.10/24 dev eth0 :: 주소 추가 (재부팅 시 사라짐)
- ip neigh :: ARP(이웃) 테이블
$ ip -br a   # → lo UNKNOWN 127.0.0.1/8 / eth0 UP 192.168.0.12/24
$ ip r | grep default   # → default via 192.168.0.1 dev eth0
$ hostname -I                     # 내 IP 빠르게
$ curl -s ifconfig.me             # 외부(공인) IP

@ ss [옵션] :: 소켓 · 포트 상태 (netstat 대체)
- -t / -u :: TCP / UDP
- -l :: LISTEN(대기) 중인 것만
- -a :: 전부
- -n :: 포트 · 주소를 숫자로
- -p :: 프로세스 이름 · PID (sudo 필요)
- -s :: 요약 통계
- state established :: 연결된 것만
$ sudo ss -tulpn                  # 열린 포트와 프로세스 (가장 많이 씀)
$ ss -tn state established | wc -l   # → 현재 연결 수 (예: 42)
$ ss -tn '( dport = :5432 )'   # → 5432 로 나가는 연결

@ netstat [옵션] :: (구버전) 소켓 · 라우팅 — ss 로 대체됨
- -tulpn :: 열린 포트와 프로세스
- -rn :: 라우팅 테이블
$ sudo netstat -tulpn   # → 열린 포트와 PID/프로그램
@ ifconfig [인터페이스] :: (구버전) 인터페이스 정보 — ip a 로 대체
@ traceroute [옵션] <호스트> :: 경로상의 라우터 추적
- -n :: 이름 해석 안 함
- -T -p 443 :: TCP 로 추적 (ICMP 막힌 곳)
$ traceroute -n 8.8.8.8   # → 1 192.168.0.1 1.1ms … 경유 라우터 목록
@ mtr [옵션] <호스트> :: ping + traceroute 실시간 결합
- -r -c N :: 보고서 모드 N회
- -w :: 넓은 출력
$ mtr -rwc 100 example.com   # → 구간별 Loss% Avg 표
@ dig [@서버] <이름> [타입] [옵션] :: DNS 조회 (상세)
- +short :: 결과만
- +trace :: 루트부터 추적
- -x <IP> :: 역방향 (PTR)
- A AAAA MX TXT NS CNAME :: 레코드 종류
$ dig +short example.com   # → 93.184.215.14
$ dig @8.8.8.8 example.com MX   # → example.com. 300 IN MX 10 mail.example.com.
$ dig -x 1.1.1.1 +short   # → one.one.one.one.
@ nslookup <이름> [서버] :: 간단 DNS 조회
@ host <이름|IP> :: 아주 간단한 DNS 조회
@ resolvectl [명령] :: systemd-resolved DNS 상태 · 캐시
- status :: 인터페이스별 DNS 서버
- flush-caches :: 캐시 비우기
- query <이름> :: 조회
$ resolvectl status   # → Link 2 (eth0) Current DNS Server: 192.168.0.1
@ whois <도메인|IP> :: 도메인 등록 정보 · IP 소유자
@ nc [옵션] <호스트> <포트> :: netcat — TCP/UDP 만능 도구
- -z :: 포트 열림만 확인 (스캔)
- -v :: 상세
- -l <포트> :: 수신 대기
- -u :: UDP
- -w 초 :: 타임아웃
$ nc -zv db.local 5432   # → Connection to db.local 5432 port [tcp] succeeded!
$ nc -zv host 20-25   # → 20~25 포트 열림 여부
$ nc -l 9000 > recv.bin               # 받는 쪽
$ nc host 9000 < send.bin             # 보내는 쪽
@ telnet <호스트> <포트> :: 포트 연결 테스트 (평문)
$ telnet smtp.example.com 25   # → 220 smtp.example.com ESMTP 응답
@ curl [옵션] <URL> :: HTTP 요청 · API 테스트 · 다운로드
~ 기본은 GET 후 본문을 화면에 출력한다. 데이터를 주면 자동으로 POST 가 된다.
- -X <메서드> :: GET POST PUT PATCH DELETE
- -H 'Name: 값' :: 요청 헤더
- -d '<데이터>' :: 본문 (POST 가 됨)
- -d @file.json :: 파일 내용을 본문으로
- --json '<JSON>' :: JSON 본문 + 헤더 자동 설정
- -F 'file=@a.png' :: 파일 업로드 (multipart)
- -o <파일> / -O :: 지정한 이름 / 원래 이름으로 저장
- -L :: 리다이렉트 따라가기
- -i / -I :: 응답 헤더 포함 / 헤더만
- -s / -S :: 진행바 숨김 / 그래도 오류는 표시
- -f :: HTTP 4xx · 5xx 면 실패로 종료 (스크립트)
- -v :: 요청 · 응답 전체 디버그
- -u user:pass :: 기본 인증
- -k :: TLS 인증서 검증 생략 (테스트에만)
- -m 초 / --retry N :: 최대 시간 / 재시도
- -w '%{http_code}' :: 결과 정보 출력
$ curl https://api.github.com/users/octocat   # → {"login": "octocat", "id": 583231, …}
$ curl -X POST localhost:3000/api/login -H 'Content-Type: application/json' -d '{"id":"kim","pw":"1234"}'   # → {"token":"…"} 로그인 응답 JSON
$ curl -H "Authorization: Bearer $TOKEN" https://api.example.com/me | jq   # → 내 정보 JSON (jq 로 정리)
$ curl -I https://example.com   # → HTTP/2 200 / content-type: text/html …
$ curl -s -o /dev/null -w '%{http_code} %{time_total}s\n' https://example.com   # → 200 0.142s
$ curl -fsS --retry 3 localhost:8080/health || echo DOWN   # → OK 응답 또는 3번 실패 시 DOWN

@ wget [옵션] <URL…> :: 파일 다운로드
- -O <파일> :: 저장할 이름 (-O - 는 화면으로)
- -P <디렉토리> :: 저장 위치
- -c :: 끊긴 다운로드 이어받기
- -q :: 조용히
- -i <파일> :: 파일에 적힌 URL 모두
- --limit-rate=1m :: 속도 제한
- -r -np -k :: 재귀 / 상위로 안 감 / 링크를 로컬로 변환
$ wget https://example.com/file.iso   # → file.iso 100%[=====>] 4.7G 35MB/s
$ wget -c -O big.iso https://example.com/big.iso   # → 끊긴 지점부터 이어받기
$ wget -qO- https://example.com/install.sh | less   # → 설치 스크립트 내용을 먼저 확인
$ wget -i urls.txt -P downloads/   # → downloads/ 에 목록의 파일 전부

@ nmap [옵션] <대상> :: 포트 · 서비스 스캔
- -p 1-1000 / -p- :: 포트 범위 / 전부
- -sV :: 서비스 버전
- -sn :: 호스트만 탐지 (ping 스캔)
- -O :: OS 추정
$ nmap -sn 192.168.0.0/24   # → Nmap scan report for 192.168.0.1 … Host is up
$ nmap -sV -p 22,80,443 server.local   # → 22/tcp open ssh OpenSSH 9.6 …
> 허가받은 네트워크에서만 스캔할 것
@ tcpdump [옵션] [필터] :: 패킷 캡처
- -i <인터페이스|any> :: 대상 인터페이스
- -nn :: 이름·포트 해석 안 함
- -w <파일> / -r <파일> :: pcap 저장 / 읽기
- -A :: 내용을 ASCII 로
- port / host / tcp :: 필터 표현
$ sudo tcpdump -i any -nn port 53   # → DNS 질의·응답 패킷이 실시간으로
$ sudo tcpdump -i eth0 -w cap.pcap host 10.0.0.5 and port 443   # → cap.pcap 저장 (Wireshark 로 분석)
@ iptables [옵션] :: (전통) 방화벽 규칙
- -L -n -v :: 규칙 목록
- -A INPUT -p tcp --dport 22 -j ACCEPT :: 허용 규칙 추가
- -D / -F :: 규칙 삭제 / 전부 비우기
$ sudo iptables -L -n -v --line-numbers   # → Chain INPUT … 번호 붙은 규칙 목록
@ nft [명령] :: nftables (iptables 후속)
$ sudo nft list ruleset   # → table inet filter { chain input { … } }
@ ufw <명령> :: Ubuntu 간단 방화벽
- enable / disable / status :: 켜기 / 끄기 / 상태
- allow 22/tcp :: 허용
- deny / delete allow 80 :: 차단 / 규칙 삭제
- allow from 10.0.0.0/8 to any port 5432 :: 출발지 제한
$ sudo ufw allow OpenSSH && sudo ufw enable   # → Rule added … Firewall is active
$ sudo ufw status numbered   # → [ 1] OpenSSH ALLOW IN Anywhere
@ firewall-cmd [옵션] :: firewalld (RHEL · Fedora)
- --list-all :: 현재 설정
- --add-port=8080/tcp --permanent :: 포트 열기
- --reload :: 적용
$ sudo firewall-cmd --add-service=http --permanent && sudo firewall-cmd --reload   # → success / success
@ nmcli [명령] :: NetworkManager 제어 (Wi-Fi · 연결)
- device status :: 장치 상태
- device wifi list :: 주변 Wi-Fi
- device wifi connect <SSID> password <암호> :: 접속
- connection show / up / down :: 연결 목록 / 켜기 / 끄기
$ nmcli device wifi list   # → IN-USE SSID MODE CHAN RATE SIGNAL BARS
$ nmcli connection show   # → NAME UUID TYPE DEVICE 연결 목록
@ ethtool <인터페이스> :: NIC 속도 · 링크 · 드라이버
$ sudo ethtool eth0 | grep -i speed   # → Speed: 1000Mb/s
@ ssh [옵션] [사용자@]<호스트> [명령] :: 원격 서버 접속
~ 키 인증이 기본. 뒤에 명령을 붙이면 원격에서 실행만 하고 돌아온다.
- -p <포트> :: 포트 (기본 22)
- -i <키> :: 개인키 파일
- -L 로컬:대상:포트 :: 로컬 포트 포워딩 (원격 DB 접속 등)
- -R 원격:대상:포트 :: 원격 포트 포워딩 (내 서비스 노출)
- -J <점프호스트> :: 배스천 서버 경유 접속
- -N :: 명령 실행 없이 터널만
- -f :: 백그라운드
- -t :: 강제 TTY (원격 대화형 명령)
- -v / -vvv :: 접속 디버그
$ ssh kim@192.168.0.10   # → kim@192.168.0.10's password: 또는 바로 접속
$ ssh -p 2222 -i ~/.ssh/work_key deploy@example.com   # → 2222 포트로 키 인증 접속
$ ssh server 'df -h; uptime'   # → 원격 df 와 uptime 결과만 출력
$ ssh -N -L 5433:localhost:5432 db-server     # 내 5433 → 원격 DB
$ ssh -J bastion kim@10.0.1.20   # → bastion 을 거쳐 내부 서버 접속
$ ssh-keygen -t ed25519 -C 'kim@laptop'      # 키 생성
$ ssh-copy-id kim@server                     # 공개키 등록
: Host web                    # ~/.ssh/config — 이후 ssh web
:   HostName 203.0.113.10
:   User deploy
:   Port 2222
:   IdentityFile ~/.ssh/work_key
> 연결이 자주 끊기면 config 에 ServerAliveInterval 60

@ scp [옵션] <원본> <대상> :: SSH 로 파일 복사
~ 원격 경로는 호스트:경로 형식. 큰 동기화나 재시도가 필요하면 rsync 가 낫다.
- -r :: 디렉토리 재귀
- -P <포트> :: 포트 (대문자 P!)
- -i <키> :: 개인키
- -p :: 시각 · 권한 보존
- -C :: 압축 전송
$ scp report.pdf kim@server:~/docs/   # → report.pdf 100% 2.1MB 5.2MB/s
$ scp kim@server:/var/log/app.log ./   # → 현재 폴더로 app.log 받기
$ scp -r -P 2222 dist/ deploy@web:/var/www/app/   # → dist 폴더 통째로 업로드

@ sftp [옵션] <사용자@호스트> :: 대화형 SSH 파일 전송
- get / put :: 받기 / 보내기
- ls / cd / lcd :: 원격 목록 / 원격 이동 / 로컬 이동
$ sftp -P 2222 deploy@web   # → sftp> 프롬프트
@ rsync [옵션] <원본> <대상> :: 바뀐 부분만 효율적으로 동기화
~ 차이 나는 부분만 보내서 백업 · 배포에 쓴다. 로컬끼리, 로컬↔원격 모두 가능.
- -a :: 아카이브: 재귀 + 권한 · 시각 · 링크 보존
- -v :: 상세 출력
- -z :: 전송 중 압축
- -P :: 진행률 + 중단 시 이어받기
- -h :: 사람 단위
- --delete :: 원본에 없는 파일은 대상에서도 삭제 (미러)
- -n / --dry-run :: 실제로 하지 않고 미리보기
- --exclude=<패턴> :: 제외 (여러 번 가능)
- -e 'ssh -p 2222' :: SSH 옵션 지정
- --bwlimit=<KB/s> :: 대역폭 제한
$ rsync -avh ~/docs/ /mnt/backup/docs/   # → sending incremental file list … 바뀐 파일만
$ rsync -avzP --delete ./build/ deploy@web:/var/www/app/   # → 진행률 표시, 서버의 남는 파일 삭제
$ rsync -avn --delete src/ dst/              # 무엇이 바뀔지 확인
$ rsync -avz --exclude='.git' --exclude='node_modules' ./ server:~/project/   # → .git·node_modules 빼고 동기화
> 원본 끝의 / 가 중요하다: src/ 는 내용물만, src 는 폴더째 복사

# 셸 · 환경 · 도움말 | shell
@ alias [이름='명령'] :: 명령 별칭
~ ~/.bashrc 에 적어야 다음 셸에서도 유지된다.

$ alias gs='git status -sb'   # → gs 로 짧은 git 상태

$ \ls                                  # 별칭 무시하고 원래 명령
