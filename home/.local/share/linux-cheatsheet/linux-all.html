$ . .venv/bin/activate   # → 프롬프트 앞에 (.venv) 표시
@ history [옵션] :: 명령 기록
- N :: 최근 N개
- -c :: 기록 지우기
- !N / !! / !$ :: N번 / 직전 / 직전 마지막 인자 재사용
- Ctrl+R :: 역방향 검색
$ history | grep docker   # → docker 가 들어간 지난 명령
$ history 20   # → 최근 20개 명령 (번호 포함)
> HISTSIZE, HISTCONTROL=ignoredups 로 기록 방식을 조정
@ man [섹션] <이름> :: 매뉴얼 페이지
- 1 / 5 / 8 :: 명령 / 파일 형식 / 관리자 명령
- -k <단어> :: 키워드 검색 (apropos)
- / n q :: 검색 / 다음 / 종료
$ man 5 crontab   # → crontab 파일 형식 설명 페이지
$ man -k 'disk usage'   # → df (1) - report file system disk space usage …
@ help <내장명령> :: 셸 내장 명령 도움말
$ help cd   # → cd: cd [-L|[-P [-e]] [-@]] [dir] 설명
@ tldr <명령> :: 실용 예시 중심 요약 매뉴얼
$ tldr tar   # → tar 자주 쓰는 예시 모음
@ apropos <키워드> :: 설명에 키워드가 들어간 명령 찾기
$ apropos compress   # → bzip2 (1) gzip (1) zstd (1) …
@ clear :: 화면 지우기 (Ctrl+L)
@ sleep <시간> :: 지정 시간 대기 (1, 0.5, 2m, 1h)
$ sleep 3 && echo done   # → 3초 뒤 done
@ test <조건> / [ <조건> ] :: 조건 검사 (참이면 종료 코드 0)
- -f / -d / -e :: 파일 / 디렉토리 / 존재
- -z / -n :: 빈 문자열 / 비어있지 않음
- -eq -ne -lt -gt :: 숫자 비교
- = != :: 문자열 비교
$ [ -f .env ] && echo '.env 있음'   # → .env 있음 (있을 때만)
$ test -d build || mkdir build   # → build 가 없으면 생성
@ read [옵션] <변수> :: 입력을 변수로 읽기
- -p '<프롬프트>' :: 안내 문구
- -s :: 입력 숨김 (비밀번호)
- -r :: 백슬래시 그대로
- -t 초 :: 시간 제한
$ read -rp '계속할까요? [y/N] ' ans   # → 계속할까요? [y/N] 입력값이 $ans 에
: while IFS= read -r line; do echo "$line"; done < list.txt
@ set [옵션] :: 셸 동작 옵션
- -e :: 오류가 나면 스크립트 종료
- -u :: 정의 안 된 변수 사용 시 오류
- -o pipefail :: 파이프 중간 실패도 오류로
- -x :: 실행하는 명령 출력 (디버그)
: set -euo pipefail
@ bc [-l] :: 계산기 (소수 계산)
$ echo 'scale=2; 10/3' | bc           # 3.33
$ echo '2^20' | bc   # → 1048576
@ expr <식> :: 간단한 정수 · 문자열 계산
$ expr 7 \* 6   # → 42
$ echo $(( 7 * 6 ))                   # 보통은 산술 확장이 편하다
@ xdg-open <파일|URL> :: 기본 앱으로 열기
$ xdg-open report.pdf   # → 기본 PDF 뷰어로 열림
$ xdg-open .                          # 파일 관리자
@ yes [문자열] :: 같은 문자열을 계속 출력 (자동 응답)
$ yes | sudo apt install pkg   # → 모든 질문에 y 로 답함
@ exit [코드] :: 셸 · 스크립트 종료 (0 성공)



# 생산성 · 모던 CLI | shell
@ pv [옵션] :: 파이프 진행률 · 속도 표시
$ pv big.sql | mysql app   # → 1.2GiB 0:00:31 [38MiB/s] [=====>  ] 62%
$ pv -L 10m bigfile > /dev/null       # 속도 제한
@ parallel [옵션] <명령> ::: <인자…> :: GNU parallel — 병렬 실행
- -j N :: 동시 작업 수
- {} / {.} :: 인자 / 확장자 뗀 인자
$ parallel -j8 convert {} {.}.webp ::: *.png   # → png 를 8개씩 동시에 webp 로
$ cat hosts.txt | parallel -j10 'ssh {} uptime'   # → 서버 10대 uptime 을 동시에
@ entr <명령> :: 파일이 바뀌면 명령 자동 실행
- -c / -r :: 화면 지우기 / 서버 재시작
$ ls src/*.py | entr -c pytest   # → 저장할 때마다 pytest 다시 실행
$ fd -e go | entr -r go run .   # → .go 저장 시 서버 재시작
@ inotifywait [옵션] <경로> :: 파일 변경 이벤트 대기 (inotify-tools)
- -m / -r :: 계속 감시 / 재귀
- -e modify,create,delete :: 이벤트 종류
$ inotifywait -mr -e close_write src/   # → src/ CLOSE_WRITE,CLOSE main.c
@ bat [옵션] <파일> :: 구문 강조 · 줄 번호 · git 변경 표시 cat
- -p / -l <언어> :: 장식 없이 / 언어 지정
$ bat src/main.rs   # → 줄 번호·구문 강조된 코드
@ eza [옵션] :: 아이콘 · git 상태 표시 ls 대체
- -l --git / -T :: 상세 + git / 트리
$ eza -la --git --icons   # → 권한 크기 날짜 git상태 아이콘 이름
@ zoxide :: 자주 가는 디렉토리로 순간 이동 (z 명령)
$ eval "$(zoxide init bash)"          # ~/.bashrc 에 추가
$ z proj                              # 'proj' 를 포함한 자주 간 경로로
@ btop :: 그래프가 있는 리소스 모니터 (CPU · 메모리 · 디스크 · 네트워크)
@ duf :: 보기 좋은 df (디스크 사용량 표)
@ sponge <파일> :: 입력을 다 읽은 뒤 같은 파일에 저장 (moreutils)
$ jq '.version="2.0"' package.json | sponge package.json   # → package.json 의 version 이 2.0 으로
@ numfmt [옵션] :: 숫자를 사람이 읽기 쉬운 단위로
$ numfmt --to=iec 123456789           # 118M
@ uuidgen :: UUID 생성
$ uuidgen                             # 3f6b…-…

# 버전 관리 | dev
@ git <하위명령> [옵션] :: 분산 버전 관리
~ 작업 트리 → add → 스테이징 → commit → 로컬 저장소 → push → 원격 저장소.
@@ 시작 · 설정
$ git config --global user.name '김개발'   # → 커밋 작성자 이름 설정
$ git config --global user.email kim@example.com   # → 커밋 작성자 이메일 설정
$ git config --global init.defaultBranch main   # → 새 저장소 기본 브랜치 main
$ git init   # → Initialized empty Git repository in …/.git/
$ git clone https://github.com/user/repo.git   # → Cloning into 'repo'… done.
$ git clone --depth 1 <url>     # 최신 이력만 (빠름)
@@ 기본 흐름
- status / status -sb :: 변경 상태 / 짧게
- add <파일> / add . :: 스테이징 / 현재 경로 전부
- add -p :: 변경 덩어리(hunk)를 골라서
- commit -m '<메시지>' :: 커밋
- commit -am '<메시지>' :: 추적 중인 파일 add + 커밋
- commit --amend :: 직전 커밋 수정 (푸시 전에만)
- diff :: 아직 스테이징 안 된 변경
- diff --staged :: 커밋될 변경
- diff main..feature :: 브랜치 간 차이
$ git add -A && git commit -m 'feat: 로그인 API 추가'   # → [main 1a2b3c4] feat: 로그인 API 추가 3 files changed
@@ 이력 보기
- log --oneline --graph --all :: 한 줄 그래프 (가장 유용)
- log -p <파일> :: 파일의 변경 내용 이력
- log --author=kim --since='1 week' :: 작성자 · 기간
- log -S '함수명' :: 그 문자열이 생기거나 없어진 커밋
- show <커밋> :: 커밋 상세
- blame <파일> :: 줄마다 마지막 수정자
@@ 브랜치 · 병합
- branch / branch -a :: 로컬 / 원격 포함 목록
- switch <브랜치> :: 이동 (checkout 대체)
- switch -c <새브랜치> :: 만들고 이동
- branch -d <브랜치> / -D :: 삭제 / 강제 삭제
- merge <브랜치> :: 현재 브랜치에 병합
- rebase main :: 내 커밋을 main 위로 재배치
- rebase -i HEAD~3 :: 최근 3개 정리 (squash · reword · drop)
- cherry-pick <커밋> :: 특정 커밋만 가져오기
- merge --abort / rebase --abort :: 충돌 시 취소
$ git switch -c feature/login   # → Switched to a new branch 'feature/login'
$ git fetch && git rebase origin/main   # → Successfully rebased and updated refs/heads/…
@@ 원격
- remote -v :: 원격 저장소 목록
- remote add origin <url> :: 원격 추가
- fetch --prune :: 받기만 + 삭제된 원격 브랜치 정리
- pull :: fetch + merge(또는 rebase)
- push -u origin <브랜치> :: 첫 푸시 + 추적 설정
- push --force-with-lease :: rebase 후 안전한 강제 푸시
- push origin --delete <브랜치> :: 원격 브랜치 삭제
@@ 되돌리기 · 임시 저장
- restore <파일> :: 작업 트리 변경 버리기
- restore --staged <파일> :: 스테이징만 취소
- reset --soft HEAD~1 :: 마지막 커밋 취소, 변경은 유지
- reset --hard HEAD :: 모든 변경 버림 (주의!)
- revert <커밋> :: 되돌리는 새 커밋 (이미 푸시했을 때)
- stash / stash -u :: 변경 임시 보관 / 미추적 파일 포함
- stash list / pop / drop :: 목록 / 꺼내기 / 버리기
- reflog :: HEAD 이동 기록 — 날린 커밋 복구
- clean -fdn → clean -fd :: 미추적 파일 삭제 미리보기 → 실행
$ git stash && git pull && git stash pop   # → 내 변경 보관 → 받기 → 다시 적용
> 커밋을 잃은 것 같으면 git reflog 로 찾아서 git reset --hard HEAD@{2}

@ gh <명령> :: GitHub CLI
- auth login :: 로그인
- repo clone <owner/repo> :: 저장소 복제
- pr create / list / checkout <번호> :: PR 만들기 / 목록 / 받아보기
- pr view --web :: 브라우저로 열기
- issue list / create :: 이슈
- run list / watch :: Actions 실행 상태
$ gh pr create --fill   # → https://github.com/user/repo/pull/124
$ gh pr checkout 123   # → PR #123 브랜치로 전환
$ gh run watch   # → 실행 중인 Actions 진행 상황

# 컨테이너 · 클라우드 | dev
@ docker <하위명령> [옵션] :: 컨테이너 빌드 · 실행 · 관리
~ 이미지(템플릿)로 컨테이너(실행 인스턴스)를 만든다. sudo 없이 쓰려면 docker 그룹에 추가.
@@ 실행 — docker run
- -d :: 백그라운드
- -it :: 대화형 + 터미널 (셸 접속)
- --name <이름> :: 이름 지정
- --rm :: 종료하면 자동 삭제
- -p 호스트:컨테이너 :: 포트 연결 (-p 8080:80)
- -v 호스트경로:컨테이너경로 :: 바인드 마운트
- -v 볼륨명:경로 :: 이름 있는 볼륨 (데이터 보존)
- -e KEY=값 / --env-file .env :: 환경 변수
- --network <네트워크> :: 네트워크 연결
- --restart unless-stopped :: 자동 재시작
$ docker run -d --name web -p 8080:80 nginx   # → 컨테이너 ID 출력, localhost:8080 에서 nginx
$ docker run --rm -it ubuntu:24.04 bash   # → root@a1b2c3:/# 셸, 나가면 삭제
$ docker run -d --name db -e POSTGRES_PASSWORD=dev -p 5432:5432 -v pgdata:/var/lib/postgresql/data postgres:16   # → localhost:5432 에 Postgres, 데이터는 pgdata 볼륨
$ docker run --rm -v "$PWD":/app -w /app node:20 npm test   # → 컨테이너 안에서 현재 폴더 테스트
@@ 관리
- ps / ps -a :: 실행 중 / 전체 컨테이너
- logs -f --tail 100 <c> :: 로그 추적
- exec -it <c> bash :: 실행 중 컨테이너에 셸 접속
- stop / start / restart <c> :: 정지 / 시작 / 재시작
- rm <c> / rm -f <c> :: 삭제 / 실행 중이어도 강제
- images / rmi <이미지> :: 이미지 목록 / 삭제
- inspect <c> :: 상세 정보 (IP, 마운트 등 JSON)
- stats :: CPU · 메모리 실시간
- system prune -a :: 안 쓰는 이미지 · 컨테이너 정리
$ docker exec -it db psql -U postgres   # → postgres=# 프롬프트
@@ 빌드 · 배포
- build -t <이름:태그> . :: 현재 폴더 Dockerfile 로 빌드
- build -f <파일> --no-cache :: 파일 지정 / 캐시 없이
- tag / push <이름:태그> :: 태그 추가 / 레지스트리에 올리기
$ docker build -t myapp:1.0 .   # → Successfully tagged myapp:1.0
@@ docker compose
- up -d / up -d --build :: 전체 실행 / 다시 빌드하고 실행
- down / down -v :: 중지 · 삭제 / 볼륨까지
- logs -f <서비스> / exec <서비스> sh :: 로그 / 접속
$ docker compose up -d && docker compose logs -f api   # → 서비스 시작 후 api 로그 추적

@ podman <명령> :: 데몬 없는 Docker 호환 컨테이너
~ 명령이 docker 와 거의 같고 root 없이(rootless) 동작한다.
$ podman run --rm -it alpine sh   # → / # alpine 셸
$ alias docker=podman   # → docker 명령이 podman 으로 실행
@ kubectl <명령> [리소스] [옵션] :: Kubernetes 클러스터 제어
- get pods -A -o wide :: 모든 네임스페이스 파드
- describe pod <p> :: 상세 · 이벤트 (오류 원인)
- logs -f <p> [-c <컨테이너>] :: 로그 추적
- exec -it <p> -- sh :: 컨테이너 접속
- apply -f <파일|디렉토리> :: 매니페스트 적용
- delete -f <파일> :: 삭제
- port-forward svc/<s> 8080:80 :: 로컬 포트 연결
- rollout restart / status deploy/<d> :: 재시작 / 진행 상태
- scale deploy/<d> --replicas=3 :: 개수 조절
- config get-contexts / use-context <c> :: 클러스터 전환
- -n <ns> :: 네임스페이스 지정
$ kubectl get pods -n prod -w   # → NAME READY STATUS RESTARTS AGE 실시간 갱신
$ kubectl logs -f deploy/api --since=10m   # → 최근 10분 api 로그 추적
@ helm <명령> :: Kubernetes 패키지(차트) 관리
- repo add / update :: 저장소 추가 / 갱신
- install / upgrade --install <이름> <차트> :: 설치 / 업그레이드
- list / uninstall :: 목록 / 삭제
- -f values.yaml / --set k=v :: 값 지정
$ helm upgrade --install api ./chart -f values.prod.yaml   # → Release "api" has been upgraded.
@ terraform <명령> :: 인프라를 코드로 관리
- init :: 프로바이더 · 백엔드 준비
- plan :: 변경 미리보기
- apply / destroy :: 적용 / 전부 삭제
- fmt / validate :: 포맷 / 문법 검사
$ terraform init && terraform plan -out tf.plan && terraform apply tf.plan   # → Plan: 3 to add, 0 to change … Apply complete!
@ ansible <호스트> -m <모듈> :: 여러 서버에 원격 작업
- -i <인벤토리> :: 서버 목록
- -a '<명령>' :: 명령 실행
- ansible-playbook <파일.yml> :: 플레이북 실행
$ ansible all -i hosts.ini -m ping   # → web1 | SUCCESS => {"ping": "pong"}
$ ansible-playbook -i hosts.ini site.yml --check   # → 실제 변경 없이 바뀔 내용만 보고

# 빌드 · 컴파일 | dev
@ make [옵션] [타깃…] :: Makefile 에 정의된 빌드 · 작업 실행
~ 타깃이 의존 파일보다 오래됐을 때만 다시 만든다. 타깃을 생략하면 첫 번째 타깃.
- -j N :: N개 병렬 작업 (-j$(nproc))
- -C <디렉토리> :: 그 디렉토리에서 실행
- -n :: 실행할 명령만 출력 (dry run)
- -B :: 모두 강제로 다시 빌드
- VAR=값 :: 변수 덮어쓰기 (make CC=clang)
: app: main.o util.o            # 타깃: 의존성
: 	$(CC) -Wall -o $@ $^         # 레시피는 반드시 탭으로 시작
: .PHONY: clean
: clean:
: 	rm -f *.o app
- $@ / $< / $^ :: 타깃 / 첫 의존성 / 모든 의존성
$ make -j8   # → 8개 작업 동시 빌드
$ make clean && make   # → 산출물 지우고 처음부터 빌드
> "missing separator" 오류는 레시피 앞이 탭이 아니라 공백이라서

@ gcc [옵션] <소스…> :: C 컴파일러 (C++ 은 g++)
- -o <파일> :: 출력 파일 이름
- -c :: 컴파일만 (.o)
- -Wall -Wextra :: 경고 켜기
- -Werror :: 경고를 오류로
- -g :: 디버그 정보 (gdb 용)
- -O0 / -O2 / -O3 :: 최적화 수준
- -std=c17 :: 언어 표준
- -I <dir> :: 헤더 경로
- -L <dir> -l<이름> :: 라이브러리 경로 · 링크
- -D NAME=값 :: 매크로 정의

<script>
(() => {

  const esc = s => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  const el = (tag, cls, html) => { const n = document.createElement(tag); if (cls) n.className = cls; if (html != null) n.innerHTML = html; return n; };

  // ---------- 원본 파싱 ----------
  function parse(src) {
    const secs = []; let sec = null, ent = null, count = 0;
    const split = s => { const i = s.indexOf(" :: "); return i < 0 ? [s, ""] : [s.slice(0, i), s.slice(i + 4)]; };
    for (const raw of src.split("\n")) {
      const line = raw.replace(/\s+$/, "");
      if (!line.trim()) continue;
      const m = line.match(/^(#|@@|@|-|\$|:|>|~) ?(.*)$/);
      if (!m) continue;
      const [, k, rest] = m;
      if (k === "#") {
        const [name, g] = rest.split(" | ");
        sec = { name: name.trim(), group: (g || "core").trim(), ents: [] }; secs.push(sec); ent = null; continue;
      }
      if (k === "@" || k === "@@") {
        const [head, desc] = split(rest);
        ent = { kind: k, head, desc, parts: [], num: k === "@" ? ++count : 0 }; sec.ents.push(ent); continue;
      }
      if (!ent) { ent = { kind: "@@", head: "", desc: "", parts: [] }; sec.ents.push(ent); }
      const push = (type, item) => {
        const last = ent.parts[ent.parts.length - 1];
        if (last && last.type === type) last.items.push(item); else ent.parts.push({ type, items: [item] });
      };
      if (k === "-") { const [key, val] = split(rest); push("opt", { key, val }); }
      else if (k === "$") push("code", { t: rest, prompt: true });
      else if (k === ":") push("code", { t: rest, prompt: false });
      else if (k === "~") push("dsc", rest);
      else push("note", rest);
    }
    return secs;
  }

  // ---------- 셸 구문 강조 ----------
  const SUBS = new Set(["git", "docker", "kubectl", "systemctl", "apt", "dnf", "npm", "pip", "cargo", "go", "ip", "snap", "flatpak", "nvm", "pyenv", "uv", "tmux", "ufw", "openssl", "perf", "timedatectl", "hostnamectl", "cmake", "compose"]);
  const PASS = new Set(["sudo", "nohup", "time", "exec", "command"]);
  const part = {
    ws: "\\s+",
    var: "\\$\\(\\(?|\\$(?:\\{[^}]*\\}|[A-Za-z_][A-Za-z0-9_]*|[0-9?@#!*$-])",
    cmt: "#.*$",
    str: "'[^']*'?|\"(?:[^\"\\\\]|\\\\.)*\"?",
    ph: "<[^\\s<>(=&][^<>]*>",
    br: "\\[[^\\]]*\\]|…",
    op: "\\|\\||&&|\\|&|2>&1|&>|>>|<<<|<<|>|<|\\||;|&|\\(|\\)",
    word: "(?:\\\\.|[^\\s'\"|;&<>()$\\\\])+|.",
  };
  const mk = keys => new RegExp(keys.map(k => `(?<${k}>${part[k]})`).join("|"), "gy");
  const RE = {
    syn: mk(["ws", "var", "str", "ph", "br", "op", "word"]),
    ex: mk(["ws", "var", "cmt", "str", "ph", "op", "word"]),
    key: mk(["ws", "var", "str", "ph", "op", "word"]),
  };
  function hl(s, mode) {
    const re = RE[mode]; re.lastIndex = 0;
    let out = "", expect = mode !== "key", subNext = false, m;
    const span = (c, t) => `<span class="t-${c}">${esc(t)}</span>`;
    while (re.lastIndex < s.length && (m = re.exec(s))) {
      const g = m.groups, t = m[0];
      if (g.ws) { out += esc(t); continue; }
      if (g.var) {
        out += span(t.startsWith("$(") ? "op" : "var", t);
        if (t.startsWith("$(")) expect = mode !== "key";
        continue;
      }
      if (g.cmt) { out += span("cmt", t); continue; }
      if (g.str) { out += span("str", t); expect = false; subNext = false; continue; }
      if (g.ph || g.br) { out += span("ph", t); if (expect && mode === "syn") expect = false; continue; }
      if (g.op) {
        out += span("op", t);
        expect = mode !== "key" && /^(\|\||&&|\|&|\||;|&|\()$/.test(t);
        subNext = false; continue;
      }
      // 단어
      if (t === "/" && mode !== "ex") { out += span("sep", t); expect = mode === "syn"; continue; }
      if (expect && /^[A-Za-z_][A-Za-z0-9_]*=/.test(t)) {
        const i = t.indexOf("=");
        out += span("var", t.slice(0, i + 1)) + esc(t.slice(i + 1)); continue;
      }
      if (/^(--?[A-Za-z0-9!%]|\+[A-Za-z])/.test(t) || t === "-" || t === "--") { out += span("opt", t); continue; }
      if (expect) {
        out += span("cmd", t); expect = PASS.has(t); subNext = SUBS.has(t); continue;
      }
      if (subNext) { out += span("sub", t); subNext = SUBS.has(t); continue; }
      out += mode === "key" ? span("k", t) : esc(t);
    }
    return out;
  }
  // 설명문 속 옵션 토큰을 코드로
  const inline = s => esc(s).replace(/(^|[\s(,])(--?[A-Za-z][\w=-]*)/g, "$1<code>$2</code>").replace(/`([^`]+)`/g, "<code>$1</code>");
  const pad = n => String(n).padStart(3, "0");

  // ---------- 블록 생성 ----------
  function entryEl(e) {
    const d = el("div", "e");
    if (e.num) { d.id = `cmd-${e.num}`; d.classList.add("cmd"); }
    if (e.head) {
      const h = el("div", "eh");
      h.innerHTML = e.kind === "@" ? `<code class="syn">${e.num ? `<span class="num">${pad(e.num)}</span>` : ""}${hl(e.head, "syn")}</code>` : `<span class="tt">${esc(e.head)}</span>`;
      if (e.desc) h.insertAdjacentHTML("beforeend", `<span class="ed">${inline(e.desc)}</span>`);
      d.append(h);
    }
    for (const p of e.parts) {
      if (p.type === "opt") {
        d.append(el("dl", "opts", p.items.map(o => `<dt>${hl(o.key, "key")}</dt><dd>${inline(o.val)}</dd>`).join("")));
      } else if (p.type === "code") {
        d.append(el("pre", "ex", p.items.map(c =>
          c.prompt ? `<span class="ln"><span class="pr">$ </span>${hl(c.t, "ex")}</span>`
                   : `<span class="ln np">${hl(c.t, "ex")}</span>`).join("")));
      } else {
        for (const n of p.items) d.append(el("p", p.type === "dsc" ? "dsc" : "nt", inline(n)));
      }
    }
    return d;
  }
  const secs = parse(document.getElementById("src").textContent);

  // ---------- 색인 · 상세 보기 ----------
  const cmds = [];
  secs.forEach(s => s.ents.forEach(e => {
    if (e.num) cmds.push({ e, s, extras: [] });
    else if (cmds.length && cmds[cmds.length - 1].s === s) cmds[cmds.length - 1].extras.push(e);
  }));
  const textOf = e => [e.head, e.desc, ...e.parts.flatMap(p => p.items.map(i => typeof i === "string" ? i : (i.key || "") + " " + (i.val || "") + " " + (i.t || "")))].join(" ");
  cmds.forEach(c => c.search = [c.e, ...c.extras].map(textOf).join(" ").toLowerCase());
  // "zcat / zless / zgrep" 처럼 한 항목에 묶인 이름도 각각 정확히 찾을 수 있게
  cmds.forEach(c => c.names = c.e.head.split(" / ").map(part => part.trim().split(/\s+/)[0].toLowerCase()).filter(n => n && !/^[[<]/.test(n)));
  const ov = document.getElementById("ov"), ovBar = document.getElementById("ov-bar"), ovBody = document.getElementById("ov-body");
  let view = null, cur = 0;
  const open = () => { ov.hidden = false; document.documentElement.classList.add("ov-open"); };
  function showIndex(keepQuery) {
    const q = keepQuery && document.getElementById("ov-q") ? document.getElementById("ov-q").value : "";
    view = "index"; open();
    ov.setAttribute("aria-label", "명령어 색인");
    ovBar.innerHTML = `<span class="ov-title"><span class="pr">$</span>리눅스 명령어 사전 · 319개</span>
      <input id="ov-q" type="search" placeholder="찾기 — 예: 포트, 압축, 로그" aria-label="명령어 찾기" autocomplete="off">`;
    const input = document.getElementById("ov-q");
    input.value = q;
    input.addEventListener("input", () => renderIndex(input.value));
    input.addEventListener("keydown", ev => {
      if (ev.key !== "Enter") return;
      const q = input.value.trim().toLowerCase();
      const exact = q && cmds.find(c => c.names.includes(q));
      const first = ovBody.querySelector(".ix-item");
      if (exact) showCmd(exact.e.num);
      else if (first) showCmd(+first.dataset.num);
    });
    renderIndex(q);
    ovBody.scrollTop = 0;
    input.focus({ preventScroll: true });
  }
  function renderIndex(q) {
    q = q.trim().toLowerCase();
    const groups = secs.map(s => ({ s, items: cmds.filter(c => c.s === s && (!q || c.search.includes(q))) })).filter(g => g.items.length);
    const jump = q ? "" : `<nav class="ix-jump">${groups.map(g => `<button type="button" data-jump="${secs.indexOf(g.s)}" style="--g:var(--g-${g.s.group})">${esc(g.s.name)} <b>${g.items.length}</b></button>`).join("")}</nav>`;
    ovBody.innerHTML = groups.length ? jump + groups.map(g => `<section class="ix-sec" data-sec="${secs.indexOf(g.s)}" style="--g:var(--g-${g.s.group})"><h3>${esc(g.s.name)} <span class="ix-n">${g.items.length}</span></h3><div class="ix-grid">${
      g.items.map(c => `<button type="button" class="ix-item" data-num="${c.e.num}"><span class="num">${pad(c.e.num)}</span><code>${esc(c.e.head.split(" ")[0])}</code><span class="ix-d">${esc(c.e.desc)}</span></button>`).join("")
    }</div></section>`).join("") : `<p class="ix-empty">"${esc(q)}" 와 맞는 명령어가 없습니다.</p>`;
  }
  function showCmd(n) {
    const c = cmds[n - 1]; if (!c) return;
    view = "cmd"; cur = n; open();
    ov.setAttribute("aria-label", `${c.e.head.split(" ")[0]} 상세`);
    ovBar.innerHTML = `<button type="button" data-act="index">← 색인</button>
      <button type="button" data-act="prev"${n === 1 ? " disabled" : ""}>◀ 이전</button>
      <span class="ov-pos">${pad(n)} / ${cmds.length}</span>
      <button type="button" data-act="next"${n === cmds.length ? " disabled" : ""}>다음 ▶</button>
      <span class="ov-sp"></span><span class="ov-keys">Esc 색인 · ← → 이동</span>`;
    const wrap = el("div", "ov-detail");
    wrap.style.setProperty("--g", `var(--g-${c.s.group})`);
    wrap.append(el("div", "ov-sec", esc(c.s.name)));
    [c.e, ...c.extras].forEach(e => { const n = entryEl(e); n.removeAttribute("id"); wrap.append(n); });
    ovBody.replaceChildren(wrap);
    ovBody.scrollTop = 0;
    ovBody.focus({ preventScroll: true });
  }
  function jumpTo(i) {
    const t = ovBody.querySelector(`.ix-sec[data-sec="${i}"]`);
    if (t) ovBody.scrollTop = t.offsetTop - 8;
  }
  ov.addEventListener("click", ev => {
    const item = ev.target.closest(".ix-item"); if (item) { showCmd(+item.dataset.num); return; }
    const j = ev.target.closest("[data-jump]"); if (j) { jumpTo(+j.dataset.jump); return; }
    const b = ev.target.closest("[data-act]"); if (!b) return;
    ({ index: () => showIndex(true), prev: () => showCmd(cur - 1), next: () => showCmd(cur + 1) })[b.dataset.act]();
  });
  document.addEventListener("keydown", ev => {
    const typing = ev.target.matches && ev.target.matches("input, textarea");
    if (ev.ctrlKey || ev.metaKey || ev.altKey) return;
    if (ov.hidden) {
      if (!typing && (ev.key === "i" || ev.key === "/")) { ev.preventDefault(); showIndex(true); }
      return;
    }
    if (ev.key === "Escape") {
      ev.preventDefault();
      if (view === "cmd") showIndex(true);
      else { const q = document.getElementById("ov-q"); if (q.value) { q.value = ""; renderIndex(""); } q.focus(); }
    }
    else if (view === "cmd" && !typing) {
      if (ev.key === "ArrowLeft" && cur > 1) showCmd(cur - 1);
      else if (ev.key === "ArrowRight" && cur < cmds.length) showCmd(cur + 1);
      else if (ev.key === "Backspace") showIndex(true);
    } else if (view === "index" && !typing && ev.key === "/") { ev.preventDefault(); document.getElementById("ov-q").focus(); }
  });

  // ---------- Ctrl+휠 확대 ----------
  // 색인 · 상세 보기는 기본 3배, 시트는 기본 1배. Ctrl+휠은 지금 보이는 쪽만 바꾼다.
  const MIN_SCALE = .5, MAX_SCALE = 6;
  const scale = { ov: 3, sheet: 1 };
  const clampScale = s => Math.min(MAX_SCALE, Math.max(MIN_SCALE, Math.round(s * 10) / 10));
  try {
    const saved = JSON.parse(localStorage.getItem("cheat-zoom-v2") || "{}");
    if (saved.ov) scale.ov = clampScale(+saved.ov);
    if (saved.sheet) scale.sheet = clampScale(+saved.sheet);
  } catch (e) {}
  const zoomTip = el("div", "zoom-tip"); zoomTip.hidden = true; document.body.append(zoomTip);
  let tipTimer;
  const activeScale = () => "ov";
  function setScale(s) {
    const k = activeScale();
    scale[k] = clampScale(s);
    try { localStorage.setItem("cheat-zoom-v2", JSON.stringify(scale)); } catch (e) {}
    layout(false);
    zoomTip.textContent = `${k === "ov" ? "색인 · 상세" : "시트"} ${Math.round(scale[k] * 100)}%`; zoomTip.hidden = false;
    clearTimeout(tipTimer); tipTimer = setTimeout(() => zoomTip.hidden = true, 900);
  }
  let wheelAt = 0;
  addEventListener("wheel", ev => {
    if (!ev.ctrlKey) return;
    ev.preventDefault();
    const now = performance.now(); if (now - wheelAt < 40) return; wheelAt = now;
    const k = activeScale(), step = scale[k] >= 2 ? .25 : .1;
    setScale(scale[k] + (ev.deltaY < 0 ? step : -step));
  }, { passive: false });
  addEventListener("keydown", ev => {
    if (!(ev.ctrlKey || ev.metaKey) || ev.altKey) return;
    const k = activeScale(), step = scale[k] >= 2 ? .25 : .1;
    if (ev.key === "=" || ev.key === "+") { ev.preventDefault(); setScale(scale[k] + step); }
    else if (ev.key === "-") { ev.preventDefault(); setScale(scale[k] - step); }
    else if (ev.key === "0") { ev.preventDefault(); setScale(k === "ov" ? 3 : 1); }
  });

  function layout() {
    ovBody.style.zoom = scale.ov !== 1 ? String(scale.ov) : "";
    const barZoom = Math.min(2, scale.ov);
    ovBar.style.zoom = barZoom !== 1 ? String(barZoom) : "";
  }
  layout();
  showIndex();
})();
</script>
</body></html>
