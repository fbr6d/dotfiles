# ReGreet (greetd greeter) — monochrome dark, matches the desktop theme.
# skip_selection: go straight to the password for the last user + session
# (kept in /var/lib/regreet/state.toml), so only the password field shows.
skip_selection = true

[background]
path = "/var/lib/greeter-bg/background.jpg"
fit = "Cover"

[GTK]
application_prefer_dark_theme = true
font_name = "Pretendard 13"
theme_name = "Adwaita-dark"

[commands]
reboot = ["systemctl", "reboot"]
poweroff = ["systemctl", "poweroff"]

[appearance]
greeting_msg = ""

[widget.clock]
format = ""
